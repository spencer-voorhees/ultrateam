<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ultrateam</title>
<link rel="icon" type="image/png" href="/ultrateam-icon.png">
<link rel="apple-touch-icon" href="/ultrateam-icon.png">
<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('ut-theme');
      if (savedTheme === 'dark' || savedTheme === 'light') {
        document.documentElement.dataset.theme = savedTheme;
      }
      if (localStorage.getItem('ut-sidebar-shelved') === 'true') {
        document.documentElement.classList.add('sidebar-shelved');
      }
      var savedWidth = parseInt(localStorage.getItem('ut-sidebar-width'), 10);
      if (savedWidth >= 200 && savedWidth <= 480) {
        document.documentElement.style.setProperty('--sidebar-width', savedWidth + 'px');
      }
    } catch (e) {}
  })();
</script>
<style>
/* ============================================================
   Instant Theme Transition Suppression (Zero Flicker)
   ============================================================ */
html.disable-transitions,
html.disable-transitions *,
html.disable-transitions *::before,
html.disable-transitions *::after {
  transition: none !important;
  animation-duration: 0s !important;
}

:root {
  color-scheme: dark;
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;

  /* Sidebar width — resizable at runtime, persisted in localStorage. */
  --sidebar-width: 260px;

  /* OpenAI-inspired high-contrast dark theme */
  --bg: #212121;
  --bg-sidebar: #171717;
  --card: #212121;
  --card-hover: #252525;
  --surface: #2a2a2a;
  --surface-hover: #303030;
  --border: rgba(255, 255, 255, 0.075);
  --border-light: rgba(255, 255, 255, 0.14);

  --text-primary: #ececec;
  --text-secondary: #c5c5c5;
  --text-tertiary: #929292;

  --accent-blue: #8ab4f8;
  --accent-green: #10a37f;
  --accent-purple: #a855f7;

  --tag-bg: #292929;
  --tag-text: #c2c2c2;

  --radius: 14px;
  --radius-sm: 8px;
  --radius-pill: 9999px;
  --shadow-float: 0 20px 48px rgba(0, 0, 0, 0.32);

  /* Provider marks: official or brand-guideline primary treatments */
  --p-anthropic: #d97757;
  --p-openai: #ececec;
  --p-google: #4285f4;
  --p-github: #c898fd;
  --p-cursor: #ececec;
  --p-human: #b4b4b4;
  --p-other: #888888;
}

:root[data-theme="light"] {
  color-scheme: light;

  /* Clean, low-chrome light theme */
  --bg: #ffffff;
  --bg-sidebar: #f9f9f9;
  --card: #ffffff;
  --card-hover: #fafafa;
  --surface: #f5f5f5;
  --surface-hover: #ececec;
  --border: rgba(13, 13, 13, 0.075);
  --border-light: rgba(13, 13, 13, 0.14);

  --text-primary: #0d0d0d;
  --text-secondary: #4f4f4f;
  --text-tertiary: #737373;

  --accent-blue: #2563eb;
  --accent-green: #10a37f;
  --accent-purple: #7e22ce;

  --tag-bg: #f4f4f4;
  --tag-text: #52525b;

  --shadow-float: 0 18px 42px rgba(0, 0, 0, 0.12);
  --p-anthropic: #d97757;
  --p-openai: #0d0d0d;
  --p-google: #4285f4;
  --p-github: #8534f3;
  --p-cursor: #0d0d0d;
  --p-human: #5d5d5d;
  --p-other: #71717a;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #ffffff;
    --bg-sidebar: #f9f9f9;
    --card: #ffffff;
    --card-hover: #fafafa;
    --surface: #f5f5f5;
    --surface-hover: #ececec;
    --border: rgba(13, 13, 13, 0.075);
    --border-light: rgba(13, 13, 13, 0.14);
    --text-primary: #0d0d0d;
    --text-secondary: #4f4f4f;
    --text-tertiary: #737373;
    --accent-blue: #2563eb;
    --accent-green: #10a37f;
    --accent-purple: #7e22ce;
    --tag-bg: #f4f4f4;
    --tag-text: #52525b;
    --shadow-float: 0 18px 42px rgba(0, 0, 0, 0.12);
    --p-anthropic: #d97757;
    --p-openai: #0d0d0d;
    --p-google: #4285f4;
    --p-github: #8534f3;
    --p-cursor: #0d0d0d;
    --p-human: #5d5d5d;
    --p-other: #71717a;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  margin: 0;
  padding: 0;
  background-color: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
  letter-spacing: -0.01em;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: clip;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: 2px;
}

/* ============================================================
   ChatGPT-Inspired Top Navigation Bar
   ============================================================ */
.nav-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  width: calc(100% - var(--sidebar-width));
  margin-left: var(--sidebar-width);
  height: 56px;
  background-color: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(16px) saturate(120%);
  border-bottom: 1px solid var(--border);
  padding: 0 1.2rem;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 1rem;
  transition: width 0.24s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.24s cubic-bezier(0.4, 0, 0.2, 1);
}
html.sidebar-shelved .nav-bar,
body.sidebar-shelved .nav-bar {
  width: 100%;
  margin-left: 0;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

.app-brand {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.42rem 0.6rem;
  color: var(--text-primary);
  min-width: 0;
}
.top-nav-brand {
  display: flex;
  min-width: 0;
}
/* The sidebar shows the app logo when open, so only surface the logo in the top
   bar once the sidebar is shelved; the workspace name is always shown. */
.top-nav-brand .ultrateam-logo-icon {
  display: none;
}
html.sidebar-shelved .top-nav-brand .ultrateam-logo-icon,
body.sidebar-shelved .top-nav-brand .ultrateam-logo-icon {
  display: block;
}

.ultrateam-logo-icon {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  display: block;
  filter: drop-shadow(0 1px 5px rgba(84, 139, 255, 0.18));
}

.ultrateam-logo-text {
  font-size: 0.92rem;
  font-weight: 650;
  letter-spacing: -0.025em;
  color: var(--text-primary);
  display: inline-block;
  max-width: min(32vw, 260px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.breadcrumb-icon {
  font-size: 1rem;
  line-height: 1;
}

.nav-center {
  flex: 0 1 520px;
  min-width: 0;
}

.search-container {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}
.search-icon-svg {
  position: absolute;
  left: 0.75rem;
  width: 14px;
  height: 14px;
  color: var(--text-secondary);
  pointer-events: none;
}
.search-box {
  width: 100%;
  height: 38px;
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  background: var(--surface);
  padding: 0.2rem 2.4rem 0.2rem 2.2rem;
  font-size: 0.84rem;
  color: var(--text-primary);
  transition: all 0.15s ease;
}
.search-box:focus {
  border-color: var(--border-light);
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--border-light);
}
.search-box::placeholder {
  color: var(--text-secondary);
}
/* type="search" renders a native clear button in WebKit/Blink; we ship our own
   #search-clear, so hide the native one to avoid two clear icons. */
.search-box::-webkit-search-cancel-button,
.search-box::-webkit-search-decoration {
  -webkit-appearance: none;
  appearance: none;
}
.search-shortcut {
  position: absolute;
  right: 0.55rem;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-secondary);
  background: transparent;
  border: 0;
  border-radius: var(--radius-pill);
  padding: 2px 6px;
  pointer-events: none;
}
.search-clear-btn {
  position: absolute;
  right: 2.1rem;
  background: none;
  border: none;
  padding: 0;
  font-size: 11px;
  color: var(--text-secondary);
  cursor: pointer;
  display: none;
}
.search-clear-btn:hover {
  color: var(--text-primary);
}
/* Once a query is typed the ✕ takes over — hide the shortcut hint (it can be
   wider than ⌘K, e.g. "Ctrl K") and let the ✕ move into its spot. */
.search-box:not(:placeholder-shown) ~ .search-shortcut {
  display: none;
}
.search-box:not(:placeholder-shown) ~ .search-clear-btn {
  right: 0.65rem;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: auto;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  padding: 0 0.65rem;
  border-radius: var(--radius-sm);
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.12s ease;
}
.nav-btn:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}
.nav-btn.icon-only {
  width: 36px;
  padding: 0;
  border-radius: var(--radius-pill);
}
.usage-trigger {
  gap: 0.4rem;
  font-weight: 550;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
}
.usage-trigger svg { color: var(--text-tertiary); }
.usage-trigger:hover svg { color: var(--text-primary); }
@media (max-width: 640px) { .usage-trigger span { display: none; } .usage-trigger { width: 36px; padding: 0; } }

/* Usage drawer */
.usage-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: color-mix(in srgb, #000 42%, transparent);
  backdrop-filter: blur(2px);
  opacity: 0;
  transition: opacity 0.2s ease;
}
.usage-backdrop.open { opacity: 1; }
.usage-drawer {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 91;
  height: 100vh;
  width: min(460px, 92vw);
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1);
}
.usage-drawer.open { transform: translateX(0); }
.usage-drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 1.25rem 0.5rem;
}
.usage-drawer-title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 1rem;
  font-weight: 650;
  letter-spacing: -0.015em;
  color: var(--text-primary);
}
.usage-drawer-title svg { color: var(--text-secondary); }
.usage-drawer-actions { display: flex; align-items: center; gap: 0.25rem; }
.usage-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 0.85rem;
}
.usage-icon-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
.usage-drawer-sub {
  margin: 0;
  padding: 0 1.25rem 0.75rem;
  font-size: 0.74rem;
  color: var(--text-tertiary);
}
.usage-drawer-body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 0.25rem 1.25rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.usage-total {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.9rem 1rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
}
.usage-total-figure { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.usage-total-label { font-size: 0.72rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.usage-total-cost { font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

.usage-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.85rem 0.95rem;
  background: var(--card);
}
.usage-card.unavailable { opacity: 0.72; }
.usage-card-head {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  margin-bottom: 0.7rem;
}
/* The head doubles as the accordion toggle for the per-model breakdown. */
.usage-card-toggle {
  width: 100%;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.usage-card-chevron {
  display: inline-flex;
  flex: 0 0 auto;
  color: var(--text-tertiary);
  transform: rotate(-90deg);
  transition: transform 0.16s ease;
}
.usage-card-chevron.is-open { transform: rotate(0deg); }
.usage-card-models {
  margin-top: 0.7rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.usage-model-row {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  min-width: 0;
}
.usage-model-name {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-secondary);
  flex: 0 1 auto;
  min-width: 0;
  max-width: 55%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.usage-model-none { font-family: inherit; font-style: italic; color: var(--text-tertiary); }
.usage-model-bar {
  flex: 1 1 auto;
  height: 4px;
  border-radius: 9999px;
  background: color-mix(in srgb, var(--p-color, var(--text-tertiary)) 14%, transparent);
  overflow: hidden;
}
.usage-model-bar-fill {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--p-color, var(--text-tertiary));
}
.usage-model-count {
  flex: 0 0 auto;
  font-size: 0.7rem;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ws-origin-mark { color: var(--text-tertiary); cursor: default; }
/* Unattributed entries read as absence, not as another model. */
.usage-model-row:has(.usage-model-none) .usage-model-bar-fill {
  background: var(--text-tertiary);
  opacity: 0.45;
}
.usage-card-avatar {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: var(--p-color, var(--text-primary));
  background: color-mix(in srgb, var(--p-color, var(--text-primary)) 13%, transparent);
}
.usage-card-name { font-size: 0.88rem; font-weight: 650; color: var(--text-primary); }
.usage-card-status {
  margin-left: auto;
  font-size: 0.68rem;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.usage-card-figure {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  margin-bottom: 0.6rem;
}
.usage-card-tokens { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.usage-card-cost {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border-radius: var(--radius-pill);
  padding: 1px 8px;
}
.usage-card-meta { font-size: 0.72rem; color: var(--text-tertiary); margin-left: auto; }

/* Contribution share bar + breakdown chips */
.stats-share {
  height: 6px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  overflow: hidden;
  margin: 0.1rem 0 0.7rem;
}
.stats-share-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--p-color, var(--accent, #3b82f6));
}
.stats-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.stats-chip {
  font-size: 0.7rem;
  color: var(--text-secondary);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border-radius: var(--radius-pill);
  padding: 2px 8px;
}
.stats-chip b { font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.usage-empty { padding: 2rem 0; text-align: center; color: var(--text-tertiary); font-size: 0.82rem; }
.sidebar-toggle-btn svg {
  width: 16px;
  height: 16px;
}
.sidebar-toggle-btn {
  display: none;
}
html.sidebar-shelved .sidebar-toggle-btn,
body.sidebar-shelved .sidebar-toggle-btn {
  display: inline-flex;
}
.mobile-menu-icon {
  display: none;
}

/* ============================================================
   ChatGPT / Productivity 2-Column Workspace Layout
   ============================================================ */
.workspace {
  width: 100%;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  gap: 0;
  align-items: stretch;
  transition: grid-template-columns 0.24s cubic-bezier(0.4, 0, 0.2, 1);
}
html.sidebar-shelved .workspace,
.workspace.sidebar-shelved {
  grid-template-columns: 0 minmax(0, 1fr);
}

.sidebar-backdrop {
  display: none;
}

/* Sidebar */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 0;
  position: fixed;
  z-index: 70;
  inset: 0 auto 0 0;
  width: var(--sidebar-width);
  height: 100vh;
  overflow-y: auto;
  padding: 0 0.8rem 2rem;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  transform: translateX(0);
  visibility: visible;
  transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear;
}
html.sidebar-shelved .sidebar,
body.sidebar-shelved .sidebar {
  transform: translateX(-100%);
  visibility: hidden;
  transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 0.24s;
}

/* Drag handle on the sidebar's right edge to resize it. Fixed-positioned so it
   tracks --sidebar-width without scrolling inside the sidebar. */
.sidebar-resizer {
  position: fixed;
  top: 0;
  bottom: 0;
  left: var(--sidebar-width);
  width: 9px;
  transform: translateX(-4px);
  z-index: 75;
  cursor: col-resize;
  background: transparent;
  border: 0;
  padding: 0;
}
.sidebar-resizer::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 3px;
  width: 2px;
  background: transparent;
  transition: background 0.15s ease;
}
.sidebar-resizer:hover::after,
.sidebar-resizer:focus-visible::after,
html.sidebar-resizing .sidebar-resizer::after {
  background: var(--accent-blue);
}
.sidebar-resizer:focus-visible {
  outline: none;
}
html.sidebar-shelved .sidebar-resizer {
  display: none;
}
/* Suppress layout transitions while actively dragging so it tracks the cursor. */
html.sidebar-resizing {
  cursor: col-resize;
  user-select: none;
}
html.sidebar-resizing .workspace,
html.sidebar-resizing .sidebar,
html.sidebar-resizing .nav-bar {
  transition: none;
}


.sidebar-header {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin: 0 -0.15rem 1.15rem;
  flex: 0 0 auto;
}
.sidebar-header .app-brand {
  min-width: 0;
}
.sidebar-shelf-btn {
  flex: 0 0 auto;
}
.sidebar-shelf-btn svg {
  width: 16px;
  height: 16px;
}
.mobile-close-icon {
  display: none;
}
.sidebar-section + .sidebar-section {
  margin-top: 1.7rem;
}

.sidebar-group-title {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--text-tertiary);
  margin: 0 0 0.5rem 0.7rem;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.nav-item-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  min-height: 38px;
  padding: 0.5rem 0.7rem;
  border-radius: var(--radius-sm);
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 0.84rem;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.12s ease;
}
.nav-item-btn:hover {
  background: var(--surface);
  color: var(--text-primary);
}
.nav-item-btn.active {
  background: var(--surface);
  color: var(--text-primary);
  font-weight: 550;
}

.nav-item-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}
.nav-item-icon {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  color: var(--text-secondary);
}
/* Keep the folder icon a fixed size in a narrow sidebar; the label truncates. */
.nav-item-left svg {
  flex: 0 0 auto;
}
.nav-item-icon-wrap {
  display: inline-flex;
  flex: 0 0 auto;
}
.ws-folder-tint {
  display: inline-flex;
  flex: 0 0 auto;
}
/* Workspace names on cards/threads truncate cleanly; hover restores the full
   name via a tooltip added only when actually cut off. */
.ws-name-tip {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* Direct svg rules (e.g. .thread-workspace svg) outrank inherited color; this
   higher-specificity rule routes the icon back to the tint span's color. */
span.ws-folder-tint > svg {
  color: inherit;
}
.nav-item-label {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Parent-path fragment shown only when two workspaces share a folder name. */
.nav-item-hint {
  min-width: 0;
  flex: 0 1 auto;
  font-size: 0.7rem;
  color: var(--text-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Workspace folder colors — one hue set that reads on both themes. */
:root {
  --ws-red: #e5484d;
  --ws-orange: #f76b15;
  --ws-yellow: #ca8a04;
  --ws-green: #30a46c;
  --ws-blue: #0090ff;
  --ws-purple: #8e4ec6;
  --ws-pink: #d6409f;
}
.nav-item-row { position: relative; }
/* The ⋯ options button sits over the count pill and swaps in on row hover. */
.nav-item-menu {
  position: absolute;
  top: 50%;
  right: 8px;
  transform: translateY(-50%);
  display: none;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--text-tertiary);
  font-size: 0.85rem;
  line-height: 1;
  cursor: pointer;
  padding: 0;
}
.nav-item-menu:hover { background: var(--surface-hover); color: var(--text-primary); }
.nav-item-row:hover .nav-item-menu,
.nav-item-row:focus-within .nav-item-menu { display: inline-flex; }
.nav-item-row:hover .nav-count-pill,
.nav-item-row:focus-within .nav-count-pill { visibility: hidden; }

/* Per-workspace options popover (display name + folder color). */
.ws-popover {
  position: fixed;
  z-index: 300;
  width: 220px;
  padding: 0.6rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.ws-popover-label {
  font-size: 0.66rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-tertiary);
}
.ws-swatches { display: flex; gap: 0.35rem; }
.ws-swatch {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid transparent;
  background: var(--swatch, var(--text-tertiary));
  cursor: pointer;
  padding: 0;
  flex: 0 0 auto;
}
.ws-swatch.none {
  background: none;
  border: 1.5px solid var(--text-tertiary);
  position: relative;
}
/* Diagonal slash marks the "no color" swatch. */
.ws-swatch.none::after {
  content: '';
  position: absolute;
  inset: 3px;
  border-top: 1.5px solid var(--text-tertiary);
  transform: rotate(-45deg) translateY(4px);
}
.ws-swatch.selected { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--swatch, var(--text-tertiary)); }
/* The flex gap spaces the divider evenly above and below; the swatch row's
   bottom margin mirrors the action button's top padding so both sides match. */
.ws-popover-divider { height: 1px; background: var(--border); margin: 0; }
.ws-swatches { margin-bottom: 4px; }
.ws-popover-action {
  border: 0;
  background: none;
  padding: 4px 2px;
  font: inherit;
  font-size: 0.78rem;
  color: var(--text-secondary);
  text-align: left;
  cursor: pointer;
  border-radius: 6px;
}
.ws-popover-action:hover { background: var(--surface-hover); color: var(--text-primary); }
/* Hidden workspaces render dimmed inside the expanded hidden section. */
.nav-item-row.is-hidden-ws { opacity: 0.55; }
.nav-hidden-toggle {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  width: 100%;
  border: 0;
  background: none;
  padding: 5px 10px;
  margin-top: 2px;
  font: inherit;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-tertiary);
  cursor: pointer;
  border-radius: 8px;
}
.nav-hidden-toggle:hover { color: var(--text-primary); background: var(--surface-hover); }
.nav-hidden-caret { display: inline-flex; transform: rotate(-90deg); transition: transform 0.16s ease; }
.nav-hidden-toggle.open .nav-hidden-caret { transform: rotate(0deg); }
.nav-count-pill {
  font-size: 0.68rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-tertiary);
}
.nav-empty-state {
  padding: 0.35rem 0.55rem;
  color: var(--text-tertiary);
  font-size: 0.75rem;
}

/* Agent Roster Item */
.agent-item-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  min-height: 38px;
  padding: 0.48rem 0.7rem;
  border-radius: var(--radius-sm);
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 0.84rem;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.12s ease;
}
.agent-item-btn:hover {
  background: var(--surface);
  color: var(--text-primary);
}
.agent-item-btn.active {
  background: var(--surface);
  color: var(--text-primary);
  font-weight: 550;
}

.agent-icon-badge {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--p-color, var(--text-primary));
  background: color-mix(in srgb, var(--p-color, var(--text-primary)) 11%, transparent);
}
.agent-icon-badge svg {
  width: 14px;
  height: 14px;
}

.agent-name-text {
  font-size: 0.84rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* ============================================================
   Main Document Content
   ============================================================ */
.document-main {
  grid-column: 2;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  min-width: 0;
  width: min(100%, 940px);
  margin: 0 auto;
  padding: 2.65rem 2.75rem 5rem;
}

/* Page Header & Properties Table */
.page-header {
  display: flex;
  flex-direction: column;
  padding-bottom: 1.05rem;
  border-bottom: 1px solid var(--border);
}

.page-title-row {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}

.page-icon {
  font-size: 1.6rem;
  line-height: 1;
}

.page-title {
  font-size: clamp(1.65rem, 2vw, 2rem);
  font-weight: 600;
  letter-spacing: -0.035em;
  color: var(--text-primary);
  margin: 0;
}

.properties-grid {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.25rem 0;
  margin-top: 0.1rem;
}

.property-chip {
  display: flex;
  align-items: center;
  gap: 0.42rem;
  background: transparent;
  border: 0;
  border-right: 1px solid var(--border);
  border-radius: 0;
  padding: 0.1rem 1rem;
  font-size: 0.78rem;
}
.property-chip:first-child { padding-left: 0; }
.property-chip:last-child { border-right: 0; }
.property-label {
  color: var(--text-tertiary);
  font-size: 0.73rem;
}
.property-value {
  color: var(--text-primary);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.count-updated {
  animation: count-settle 0.24s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ============================================================
   Zero-Flicker Skeleton & Placeholder States
   ============================================================ */
.skeleton-shimmer {
  display: inline-block;
  background: color-mix(in srgb, var(--surface-hover) 75%, var(--text-tertiary) 25%);
  border-radius: 4px;
  animation: skeleton-pulse 1.4s ease-in-out infinite;
  vertical-align: middle;
}
.skeleton-title {
  width: 140px;
  height: 1.55rem;
  border-radius: 6px;
}
.skeleton-num {
  width: 16px;
  height: 0.85rem;
  border-radius: 3px;
}
.skeleton-badge {
  width: 12px;
  height: 0.72rem;
  border-radius: 3px;
}
.skeleton-card {
  pointer-events: none;
  user-select: none;
  border-color: var(--border);
}
.skeleton-bar {
  background: color-mix(in srgb, var(--surface-hover) 75%, var(--text-tertiary) 25%);
  border-radius: 4px;
  animation: skeleton-pulse 1.4s ease-in-out infinite;
}
@keyframes skeleton-pulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.75; }
}

/* Database Views Toolbar */
.views-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding-bottom: 0;
}

/* Timeline / Threads segmented toggle */
.feed-view-toggle {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  background: var(--bg-subtle, var(--surface));
  border: 1px solid var(--border);
  border-radius: 8px;
  flex: 0 0 auto;
}
.feed-view-btn {
  border: 0;
  background: transparent;
  color: var(--text-tertiary);
  font-size: 0.72rem;
  font-weight: 550;
  padding: 0.28rem 0.6rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.12s ease;
}
.feed-view-btn:hover { color: var(--text-primary); }
.feed-view-btn.active {
  background: var(--card);
  color: var(--text-primary);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}

/* Work-thread groups (branch-based) */
.thread-group {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: color-mix(in srgb, var(--surface) 45%, transparent);
  margin-bottom: 0.9rem;
  overflow: hidden;
}
.thread-head {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  width: 100%;
  padding: 0.7rem 0.85rem;
  background: transparent;
  border: 0;
  cursor: pointer;
  text-align: left;
  color: var(--text-primary);
}
.thread-head:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.thread-head-labels {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
  flex: 0 1 auto;
}
.thread-workspace {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  border-radius: var(--radius-pill);
  padding: 2px 8px 2px 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
  flex: 0 1 auto;
}
.thread-workspace svg { color: var(--text-tertiary); flex: 0 0 auto; }
.thread-workspace span { overflow: hidden; text-overflow: ellipsis; }
.thread-branch {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.thread-branch svg { color: var(--text-tertiary); flex: 0 0 auto; }
.thread-branch span { overflow: hidden; text-overflow: ellipsis; }
.thread-relay {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 0 0 auto;
}
.thread-relay .agent-icon-badge { width: 18px; height: 18px; }
.thread-relay-arrow { color: var(--text-tertiary); font-size: 0.7rem; margin: 0 1px; }
.thread-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.72rem;
  color: var(--text-tertiary);
  flex: 0 0 auto;
}
.thread-chevron { display: inline-flex; transition: transform 0.16s ease; flex: 0 0 auto; }
.thread-group.collapsed .thread-chevron { transform: rotate(-90deg); }
.thread-body { padding: 0.35rem 0.85rem 0.6rem; display: flex; flex-direction: column; }
.thread-group.collapsed .thread-body { display: none; }

/* Thread-as-exchange: avatar rail + connecting line + authored message */
.thread-msg { display: flex; gap: 0.7rem; align-items: stretch; }
.thread-msg-rail {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 0 0 auto;
  width: 26px;
}
.thread-msg-avatar {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--p-color, var(--text-primary));
  background: color-mix(in srgb, var(--p-color, var(--text-primary)) 13%, var(--card));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--p-color, var(--text-primary)) 22%, transparent);
  flex: 0 0 auto;
  z-index: 1;
}
.thread-msg-line {
  flex: 1 1 auto;
  width: 2px;
  margin: 3px 0;
  background: linear-gradient(to bottom, var(--border-light), color-mix(in srgb, var(--border) 60%, transparent));
  border-radius: 2px;
}
.thread-msg-last .thread-msg-line { display: none; }
.thread-msg-content { flex: 1 1 auto; min-width: 0; padding-bottom: 0.75rem; }
.thread-msg-author {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  margin: 0.2rem 0 0.4rem;
  flex-wrap: wrap;
  width: 100%;
  background: none;
  border: 0;
  padding: 0.15rem 0;
  cursor: pointer;
  text-align: left;
}
.thread-msg-name { font-size: 0.82rem; font-weight: 650; color: var(--text-primary); }
.thread-msg-toggle {
  display: inline-flex;
  align-self: center;
  color: var(--text-tertiary);
  transform: rotate(-90deg);
  transition: transform 0.16s ease;
}
.thread-msg-toggle.is-open { transform: rotate(0deg); }
.thread-msg-author:hover .thread-msg-toggle { color: var(--text-secondary); }

/* Condensed thread entry (collapsed default) */
.thread-entry {
  display: flex;
  align-items: flex-start;
  gap: 0.55rem;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.6rem 0.75rem;
  cursor: pointer;
}
.thread-entry-body { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; flex: 1 1 auto; }
.thread-entry-titlerow {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-width: 0;
}
.thread-entry-titlerow .kind-pill { flex: 0 0 auto; margin-left: auto; }
.thread-entry-title {
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.thread-entry-summary {
  font-size: 0.76rem;
  color: var(--text-secondary);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.thread-entry-counts { font-size: 0.68rem; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.thread-msg-time { font-size: 0.7rem; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.thread-msg-pass-tag {
  font-size: 0.66rem;
  font-weight: 600;
  color: var(--accent, var(--text-secondary));
  background: color-mix(in srgb, var(--accent, var(--text-secondary)) 12%, transparent);
  border-radius: var(--radius-pill);
  padding: 1px 7px;
}

/* "Show N earlier" expander, aligned with the message content past the rail */
.thread-more {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-left: 33px;
  padding: 0.35rem 0 0.5rem;
  background: none;
  border: 0;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 0.76rem;
  font-weight: 600;
}
.thread-more:hover { color: var(--text-primary); }
.thread-more-caret { display: inline-flex; color: var(--text-tertiary); transform: rotate(-90deg); transition: transform 0.16s ease; }
.thread-more-caret.is-open { transform: rotate(0deg); }

/* Expand / collapse-all toolbar */
.thread-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0 0.25rem 0.4rem;
}
.thread-toolbar-count { font-size: 0.72rem; color: var(--text-tertiary); font-weight: 500; }
.thread-toolbar-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: none;
  border: 0;
  cursor: pointer;
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--text-secondary);
  padding: 0.25rem 0.4rem;
  border-radius: 6px;
}
.thread-toolbar-btn:hover { color: var(--text-primary); background: color-mix(in srgb, var(--surface) 70%, transparent); }
.thread-toolbar-caret { display: inline-flex; transition: transform 0.16s ease; }
.thread-toolbar-btn.is-collapsed .thread-toolbar-caret { transform: rotate(-90deg); }

/* New-entry pulse on a thread head, auto-dismissed */
.thread-group.thread-has-new > .thread-head { animation: thread-new-flash 2.4s ease-out 1; }
.thread-new-badge {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #fff;
  background: var(--accent, #3b82f6);
  border-radius: var(--radius-pill);
  padding: 1px 7px;
  animation: thread-new-fade 4s ease-out forwards;
}
@keyframes thread-new-flash {
  0% { background: color-mix(in srgb, var(--accent, #3b82f6) 20%, transparent); }
  100% { background: transparent; }
}
@keyframes thread-new-fade {
  0%, 70% { opacity: 1; transform: none; }
  100% { opacity: 0; transform: translateY(-2px); }
}

.views-tabs {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
  width: 100%;
}

.view-tab-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  min-height: 40px;
  padding: 0.5rem 0.78rem;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: -1px;
  transition: all 0.12s ease;
}
.view-tab-btn:hover {
  color: var(--text-primary);
}
.view-tab-btn.active {
  color: var(--text-primary);
  border-bottom-color: var(--text-primary);
  font-weight: 650;
}
.view-tab-count {
  font-size: 0.68rem;
  font-variant-numeric: tabular-nums;
  opacity: 0.7;
}

/* Timeline Stream */
.timeline-feed {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  transition: opacity 0.14s ease, transform 0.14s ease;
}
.timeline-feed.feed-refreshing {
  opacity: 0.55;
  transform: translateY(2px);
}

/* Card Block */
.notion-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  transition: border-color 0.16s ease, background 0.16s ease;
  overflow-wrap: anywhere;
}
.notion-card.entry-new {
  animation: entry-arrive 0.48s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.notion-card.entry-new::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  animation: entry-highlight 1.4s ease-out both;
}
.notion-card {
  position: relative;
}
.notion-card.selected {
  border-color: var(--border-light);
  box-shadow: 0 0 0 1px var(--border-light);
}

.card-header-line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  column-gap: 0.75rem;
  row-gap: 0.5rem;
  margin-bottom: 0.7rem;
}

.card-meta-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  min-width: 0;
}

.agent-badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: transparent;
  border: 0;
  border-radius: var(--radius-pill);
  padding: 0;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-primary);
  min-width: 0;
}
.agent-badge-pill .agent-icon-badge {
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--p-color, var(--text-primary));
  background: color-mix(in srgb, var(--p-color, var(--text-primary)) 11%, transparent);
  border-radius: 6px;
}
.agent-badge-pill .agent-icon-badge svg {
  width: 13px;
  height: 13px;
}
.agent-identity-copy {
  display: inline-flex;
  align-items: baseline;
  gap: 0;
  min-width: 0;
}
.agent-model-inline {
  font-family: var(--font-mono);
  font-size: 0.67rem;
  font-weight: 400;
  color: var(--text-tertiary);
  max-width: 230px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.agent-model-inline::before {
  content: '·';
  margin-left: 0.3rem;
  margin-right: 0.3rem;
}

.kind-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.65rem;
  font-weight: 600;
  border-radius: var(--radius-pill);
  padding: 2px 7px;
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  color: var(--text-secondary);
  border: 0;
}
.kind-pill svg {
  width: 10px;
  height: 10px;
}

.card-time {
  font-size: 0.73rem;
  color: var(--text-tertiary);
  line-height: 20px;
  white-space: nowrap;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.card-title {
  margin: 0 0 0.45rem 0;
  font-size: 1.03rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--text-primary);
}
.card-title-btn {
  background: none;
  border: none;
  padding: 0;
  text-align: left;
  cursor: pointer;
  color: inherit;
  font: inherit;
}
.card-title-btn:hover {
  color: color-mix(in srgb, var(--text-primary) 82%, var(--text-secondary));
}

.card-summary {
  margin: 0;
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.62;
}
.card-context-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.35rem 0.75rem;
  margin-top: 0.6rem;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  font-size: 0.68rem;
}
.card-context-item {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  min-width: 0;
}
.card-context-item svg {
  width: 10px;
  height: 10px;
  flex: 0 0 auto;
}

/* Notion Toggle Disclosure Blocks */
.toggle-block {
  margin-top: 0.85rem;
  border-top: 1px solid var(--border);
  padding-top: 0.8rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.resume-capsule {
  padding: 0.8rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}
.resume-objective {
  font-size: 0.84rem;
  line-height: 1.5;
  color: var(--text-primary);
}
.resume-label {
  display: block;
  margin-bottom: 0.2rem;
  color: var(--text-tertiary);
  font-size: 0.67rem;
  font-weight: 650;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.resume-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.65rem 1rem;
}
.resume-list {
  margin: 0;
  padding-left: 1rem;
  color: var(--text-secondary);
  font-size: 0.78rem;
  line-height: 1.5;
}
@media (max-width: 640px) {
  .resume-grid { grid-template-columns: 1fr; }
}

.toggle-header-btn {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  background: none;
  border: none;
  padding: 0;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  text-align: left;
}
.toggle-header-btn:hover {
  color: var(--text-primary);
}
.toggle-triangle {
  font-size: 0.65rem;
  transition: transform 0.15s ease;
}
.toggle-triangle.open {
  transform: rotate(90deg);
}

.bullet-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.bullet-item {
  display: flex;
  align-items: baseline;
  gap: 0.45rem;
  font-size: 0.8rem;
  color: var(--text-primary);
}
.bullet-dot {
  color: var(--text-tertiary);
}

/* Files Block */
.files-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}
.file-badge-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  background: var(--surface);
  border: 0;
  border-radius: 7px;
  padding: 2px 7px;
  color: var(--text-primary);
  cursor: default;
  transition: all 0.12s ease;
}

/* Tags Block */
.tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.notion-tag {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  background: var(--tag-bg);
  color: var(--tag-text);
  border: 0;
  border-radius: 6px;
  padding: 2px 6px;
}

/* Card Action Footer */
.card-action-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-top: 0.95rem;
  padding-top: 0.7rem;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.action-cluster {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.action-pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  min-height: 30px;
  background: transparent;
  border: 0;
  border-radius: 8px;
  padding: 0.25rem 0.55rem;
  font-size: 0.75rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.12s ease;
}
.action-pill-btn:hover {
  background: var(--surface);
  color: var(--text-primary);
}
.action-pill-btn.active {
  background: var(--surface);
  color: var(--text-primary);
}
.action-pill-btn:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: 1px;
}

.card-inline-panel {
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
  transform-origin: top;
  animation: panel-expand 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.card-inline-panel.panel-closing {
  animation: panel-collapse 0.14s ease-in both;
}
.inline-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.55rem;
}
.inline-panel-actions {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}
.panel-icon-btn {
  width: 30px;
  min-width: 30px;
  padding: 0;
  justify-content: center;
}
.collapse-icon {
  display: inline-flex;
  transform: rotate(180deg);
}
.inline-panel-title {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.75rem;
  font-weight: 650;
}
.card-inline-panel .code-container {
  max-height: 420px;
  overflow: auto;
}
.card-inline-panel .toggle-block {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}
.command-list {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.command-item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.35rem;
}
.command-item-label {
  color: var(--text-tertiary);
  font-size: 0.68rem;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.id-label {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text-tertiary);
}

/* Copyable text displayed inside expanded card panels. */
.code-container {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  line-height: 1.5;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.85rem;
  margin: 0;
  white-space: pre-wrap;
  color: var(--text-primary);
}
.toast-box {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: var(--card);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 0.45rem 1.1rem;
  font-size: 0.78rem;
  font-weight: 500;
  box-shadow: var(--shadow-float);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: all 0.18s ease;
}
.toast-box.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.empty-block {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3.5rem 1.5rem;
  text-align: center;
  color: var(--text-secondary);
}

@keyframes entry-arrive {
  from { opacity: 0; transform: translateY(-10px) scale(0.992); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes entry-highlight {
  0% { box-shadow: inset 3px 0 0 #6e8cff, 0 0 0 1px rgba(110, 140, 255, 0.2); }
  100% { box-shadow: inset 3px 0 0 transparent, 0 0 0 1px transparent; }
}
@keyframes panel-expand {
  from { opacity: 0; transform: translateY(-4px) scaleY(0.985); }
  to { opacity: 1; transform: translateY(0) scaleY(1); }
}
@keyframes panel-collapse {
  from { opacity: 1; transform: translateY(0) scaleY(1); }
  to { opacity: 0; transform: translateY(-3px) scaleY(0.985); }
}
@keyframes count-settle {
  from { opacity: 0.45; transform: translateY(-2px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .timeline-feed,
  .notion-card,
  .card-inline-panel,
  .sidebar,
  .workspace,
  .nav-bar,
  .sidebar-backdrop,
  .toast-box {
    animation: none !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 820px) {
  .nav-bar,
  body.sidebar-shelved .nav-bar {
    width: 100%;
    margin-left: 0;
  }
  .sidebar-resizer {
    display: none;
  }
  .workspace {
    display: block;
  }
  .sidebar {
    position: fixed;
    z-index: 70;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(300px, calc(100vw - 48px));
    height: auto;
    padding: 0 0.8rem 2rem;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    border-bottom: 0;
    box-shadow: var(--shadow-float);
    transform: translateX(-102%);
    visibility: hidden;
    transition: transform 0.2s ease, visibility 0s linear 0.2s;
  }
  body.sidebar-open {
    overflow: hidden;
  }
  body.sidebar-open .sidebar {
    transform: translateX(0);
    visibility: visible;
    transition: transform 0.2s ease;
  }
  .sidebar-backdrop {
    display: block;
    position: fixed;
    z-index: 60;
    inset: 0;
    border: 0;
    padding: 0;
    background: rgba(0, 0, 0, 0.42);
    backdrop-filter: blur(2px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0s linear 0.2s;
  }
  body.sidebar-open .sidebar-backdrop {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 0.2s ease;
  }
  .desktop-sidebar-icon {
    display: none;
  }
  .sidebar-toggle-btn {
    display: inline-flex;
  }
  .top-nav-brand,
  body.sidebar-shelved .top-nav-brand {
    display: flex;
  }
  .top-nav-brand .ultrateam-logo-icon {
    display: block; /* sidebar is a drawer on mobile, so show the logo in the top bar */
  }
  .mobile-menu-icon {
    display: block;
  }
  .sidebar-shelf-btn .desktop-sidebar-icon {
    display: none;
  }
  .sidebar-shelf-btn .mobile-close-icon {
    display: block;
  }
  .nav-center {
    max-width: 280px;
  }
  .document-main {
    width: 100%;
    padding: 1.75rem 1rem 4rem;
  }
  .views-tabs {
    overflow-x: auto;
    scrollbar-width: none;
  }
  .views-tabs::-webkit-scrollbar {
    display: none;
  }
  .view-tab-btn {
    flex: 0 0 auto;
  }
}

@media (max-width: 560px) {
  .nav-bar {
    padding: 0 0.65rem;
    gap: 0.45rem;
  }
  .search-shortcut {
    display: none;
  }
  .nav-center {
    flex: 1 1 auto;
    max-width: none;
  }
  .search-box {
    padding-right: 2rem;
  }
  .search-clear-btn {
    right: 0.75rem;
  }
  .sidebar {
    width: min(288px, calc(100vw - 44px));
  }
  .notion-card {
    padding: 1.05rem;
    border-radius: 14px;
  }
}

/* Below ~680px the header stat strip wraps mid-row and leaves dangling
   dividers; switch it to a clean 2-column grid with each stat stacked. */
@media (max-width: 680px) {
  .properties-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.7rem 1rem;
  }
  .property-chip,
  .property-chip:first-child,
  .property-chip:last-child {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.1rem;
    border-right: 0;
    padding: 0;
  }
  .property-label { font-size: 0.7rem; }
  .property-value { font-size: 0.98rem; }
}
