<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ultrateam — shared agent memory</title>
<script>
  (function() {
    try {
      var saved = localStorage.getItem('ut-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.dataset.theme = saved;
      }
    } catch (e) {}
  })();
</script>
<style>
/* ============================================================
   Instant Theme Transition Suppression (Zero Flicker)
   ============================================================ */
html.disable-transitions,
html.disable-transitions *,
html.disable-transitions *::before,
html.disable-transitions *::after {
  transition: none !important;
  animation-duration: 0s !important;
}

:root {
  color-scheme: dark;
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;

  /* OpenAI-inspired high-contrast dark theme */
  --bg: #212121;
  --bg-sidebar: #171717;
  --card: #212121;
  --card-hover: #252525;
  --surface: #2a2a2a;
  --surface-hover: #303030;
  --border: rgba(255, 255, 255, 0.075);
  --border-light: rgba(255, 255, 255, 0.14);

  --text-primary: #ececec;
  --text-secondary: #c5c5c5;
  --text-tertiary: #929292;

  --accent-blue: #8ab4f8;
  --accent-green: #10a37f;
  --accent-purple: #a855f7;

  --tag-bg: #292929;
  --tag-text: #c2c2c2;

  --radius: 14px;
  --radius-sm: 8px;
  --radius-pill: 9999px;
  --shadow-float: 0 20px 48px rgba(0, 0, 0, 0.32);

  /* Provider marks: official or brand-guideline primary treatments */
  --p-anthropic: #d97757;
  --p-openai: #ececec;
  --p-google: #4285f4;
  --p-github: #c898fd;
  --p-cursor: #ececec;
  --p-human: #b4b4b4;
  --p-other: #888888;
}

:root[data-theme="light"] {
  color-scheme: light;

  /* Clean, low-chrome light theme */
  --bg: #ffffff;
  --bg-sidebar: #f9f9f9;
  --card: #ffffff;
  --card-hover: #fafafa;
  --surface: #f5f5f5;
  --surface-hover: #ececec;
  --border: rgba(13, 13, 13, 0.075);
  --border-light: rgba(13, 13, 13, 0.14);

  --text-primary: #0d0d0d;
  --text-secondary: #4f4f4f;
  --text-tertiary: #737373;

  --accent-blue: #2563eb;
  --accent-green: #10a37f;
  --accent-purple: #7e22ce;

  --tag-bg: #f4f4f4;
  --tag-text: #52525b;

  --shadow-float: 0 18px 42px rgba(0, 0, 0, 0.12);
  --p-anthropic: #d97757;
  --p-openai: #0d0d0d;
  --p-google: #4285f4;
  --p-github: #8534f3;
  --p-cursor: #0d0d0d;
  --p-human: #5d5d5d;
  --p-other: #71717a;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #ffffff;
    --bg-sidebar: #f9f9f9;
    --card: #ffffff;
    --card-hover: #fafafa;
    --surface: #f5f5f5;
    --surface-hover: #ececec;
    --border: rgba(13, 13, 13, 0.075);
    --border-light: rgba(13, 13, 13, 0.14);
    --text-primary: #0d0d0d;
    --text-secondary: #4f4f4f;
    --text-tertiary: #737373;
    --accent-blue: #2563eb;
    --accent-green: #10a37f;
    --accent-purple: #7e22ce;
    --tag-bg: #f4f4f4;
    --tag-text: #52525b;
    --shadow-float: 0 18px 42px rgba(0, 0, 0, 0.12);
    --p-anthropic: #d97757;
    --p-openai: #0d0d0d;
    --p-google: #4285f4;
    --p-github: #8534f3;
    --p-cursor: #0d0d0d;
    --p-human: #5d5d5d;
    --p-other: #71717a;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  margin: 0;
  padding: 0;
  background-color: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
  letter-spacing: -0.01em;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: clip;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: 2px;
}

/* ============================================================
   ChatGPT-Inspired Top Navigation Bar
   ============================================================ */
.nav-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  width: calc(100% - 260px);
  margin-left: 260px;
  height: 56px;
  background-color: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(16px) saturate(120%);
  border-bottom: 1px solid transparent;
  padding: 0 1.2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  transition: width 0.24s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.24s cubic-bezier(0.4, 0, 0.2, 1);
}
body.sidebar-shelved .nav-bar {
  width: 100%;
  margin-left: 0;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

.app-brand {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.42rem 0.6rem;
  color: var(--text-primary);
}
.top-nav-brand {
  display: none;
}
body.sidebar-shelved .top-nav-brand {
  display: flex;
}

.ultrateam-logo-icon {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  display: block;
}

.ultrateam-logo-text {
  font-size: 0.92rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--text-primary);
  display: inline-block;
}

.breadcrumb-icon {
  font-size: 1rem;
  line-height: 1;
}

.nav-center {
  flex: 1;
  max-width: 520px;
}

.search-container {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}
.search-icon-svg {
  position: absolute;
  left: 0.75rem;
  width: 14px;
  height: 14px;
  color: var(--text-secondary);
  pointer-events: none;
}
.search-box {
  width: 100%;
  height: 38px;
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  background: var(--surface);
  padding: 0.2rem 2.4rem 0.2rem 2.2rem;
  font-size: 0.84rem;
  color: var(--text-primary);
  transition: all 0.15s ease;
}
.search-box:focus {
  border-color: var(--border-light);
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--border-light);
}
.search-box::placeholder {
  color: var(--text-secondary);
}
.search-shortcut {
  position: absolute;
  right: 0.55rem;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-secondary);
  background: transparent;
  border: 0;
  border-radius: var(--radius-pill);
  padding: 2px 6px;
  pointer-events: none;
}
.search-clear-btn {
  position: absolute;
  right: 2.1rem;
  background: none;
  border: none;
  padding: 0;
  font-size: 11px;
  color: var(--text-secondary);
  cursor: pointer;
  display: none;
}
.search-clear-btn:hover {
  color: var(--text-primary);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  padding: 0 0.65rem;
  border-radius: var(--radius-sm);
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.12s ease;
}
.nav-btn:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}
.nav-btn.icon-only {
  width: 36px;
  padding: 0;
  border-radius: var(--radius-pill);
}
.sidebar-toggle-btn svg {
  width: 16px;
  height: 16px;
}
.sidebar-toggle-btn {
  display: none;
}
body.sidebar-shelved .sidebar-toggle-btn {
  display: inline-flex;
}
.mobile-menu-icon {
  display: none;
}

/* ============================================================
   ChatGPT / Productivity 2-Column Workspace Layout
   ============================================================ */
.workspace {
  width: 100%;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 0;
  align-items: stretch;
  transition: grid-template-columns 0.24s cubic-bezier(0.4, 0, 0.2, 1);
}
.workspace.sidebar-shelved {
  grid-template-columns: 0 minmax(0, 1fr);
}

.sidebar-backdrop {
  display: none;
}

/* Sidebar */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 0;
  position: fixed;
  z-index: 70;
  inset: 0 auto 0 0;
  width: 260px;
  height: 100vh;
  overflow-y: auto;
  padding: 0 0.8rem 2rem;
  background: var(--bg-sidebar);
  border-right: 0;
  transform: translateX(0);
  visibility: visible;
  transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear;
}
body.sidebar-shelved .sidebar {
  transform: translateX(-100%);
  visibility: hidden;
  transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 0.24s;
}

.sidebar-header {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin: 0 -0.15rem 1.15rem;
  flex: 0 0 auto;
}
.sidebar-header .app-brand {
  min-width: 0;
}
.sidebar-shelf-btn {
  flex: 0 0 auto;
}
.sidebar-shelf-btn svg {
  width: 16px;
  height: 16px;
}
.mobile-close-icon {
  display: none;
}
.sidebar-section + .sidebar-section {
  margin-top: 1.7rem;
}

.sidebar-group-title {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--text-tertiary);
  margin: 0 0 0.5rem 0.7rem;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.nav-item-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  min-height: 38px;
  padding: 0.5rem 0.7rem;
  border-radius: var(--radius-sm);
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 0.84rem;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.12s ease;
}
.nav-item-btn:hover {
  background: var(--surface);
  color: var(--text-primary);
}
.nav-item-btn.active {
  background: var(--surface);
  color: var(--text-primary);
  font-weight: 550;
}

.nav-item-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}
.nav-item-icon {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  color: var(--text-secondary);
}
.nav-item-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-count-pill {
  font-size: 0.68rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-tertiary);
}

/* Agent Roster Item */
.agent-item-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  min-height: 42px;
  padding: 0.48rem 0.7rem;
  border-radius: var(--radius-sm);
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 0.84rem;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.12s ease;
}
.agent-item-btn:hover {
  background: var(--surface);
  color: var(--text-primary);
}
.agent-item-btn.active {
  background: var(--surface);
  color: var(--text-primary);
  font-weight: 550;
}

.agent-icon-badge {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--p-color, var(--text-primary));
  background: color-mix(in srgb, var(--p-color, var(--text-primary)) 11%, transparent);
}
.agent-icon-badge svg {
  width: 14px;
  height: 14px;
}

.agent-name-text {
  font-size: 0.84rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.agent-model-text {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ============================================================
   Main Document Content
   ============================================================ */
.document-main {
  grid-column: 2;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  min-width: 0;
  width: min(100%, 940px);
  margin: 0 auto;
  padding: 2.65rem 2.75rem 5rem;
}

/* Page Header & Properties Table */
.page-header {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  padding-bottom: 1.55rem;
  border-bottom: 1px solid var(--border);
}

.page-title-row {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}

.page-icon {
  font-size: 1.6rem;
  line-height: 1;
}

.page-title {
  font-size: clamp(1.65rem, 2vw, 2rem);
  font-weight: 600;
  letter-spacing: -0.035em;
  color: var(--text-primary);
  margin: 0;
}

.properties-grid {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.25rem 0;
  margin-top: 0.1rem;
}

.property-chip {
  display: flex;
  align-items: center;
  gap: 0.42rem;
  background: transparent;
  border: 0;
  border-right: 1px solid var(--border);
  border-radius: 0;
  padding: 0.1rem 1rem;
  font-size: 0.78rem;
}
.property-chip:first-child { padding-left: 0; }
.property-chip:last-child { border-right: 0; }
.property-label {
  color: var(--text-tertiary);
  font-size: 0.73rem;
}
.property-value {
  color: var(--text-primary);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

/* Database Views Toolbar */
.views-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding-bottom: 0;
}

.views-tabs {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
  width: 100%;
}

.view-tab-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  min-height: 40px;
  padding: 0.5rem 0.78rem;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: -1px;
  transition: all 0.12s ease;
}
.view-tab-btn:hover {
  color: var(--text-primary);
}
.view-tab-btn.active {
  color: var(--text-primary);
  border-bottom-color: var(--text-primary);
  font-weight: 650;
}
.view-tab-count {
  font-size: 0.68rem;
  font-variant-numeric: tabular-nums;
  opacity: 0.7;
}

/* Timeline Stream */
.timeline-feed {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

/* Card Block */
.notion-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  transition: border-color 0.16s ease, background 0.16s ease;
  overflow-wrap: anywhere;
}
.notion-card:hover {
  background: var(--card-hover);
  border-color: var(--border-light);
}
.notion-card.selected {
  border-color: var(--border-light);
  box-shadow: 0 0 0 1px var(--border-light);
}

.card-header-line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  column-gap: 0.75rem;
  row-gap: 0.5rem;
  margin-bottom: 0.7rem;
}

.card-meta-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  min-width: 0;
}

.agent-badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: transparent;
  border: 0;
  border-radius: var(--radius-pill);
  padding: 0;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-primary);
  min-width: 0;
}
.agent-badge-pill .agent-icon-badge {
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--p-color, var(--text-primary));
  background: color-mix(in srgb, var(--p-color, var(--text-primary)) 11%, transparent);
  border-radius: 6px;
}
.agent-badge-pill .agent-icon-badge svg {
  width: 13px;
  height: 13px;
}
.agent-identity-copy {
  display: inline-flex;
  align-items: baseline;
  gap: 0;
  min-width: 0;
}
.agent-model-inline {
  font-family: var(--font-mono);
  font-size: 0.67rem;
  font-weight: 400;
  color: var(--text-tertiary);
  max-width: 230px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.agent-model-inline::before {
  content: '·';
  margin-right: 0.3rem;
}

.kind-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.65rem;
  font-weight: 600;
  border-radius: var(--radius-pill);
  padding: 2px 7px;
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  color: var(--text-secondary);
  border: 0;
}
.kind-pill svg {
  width: 10px;
  height: 10px;
}

.card-time {
  font-size: 0.73rem;
  color: var(--text-tertiary);
  line-height: 20px;
  white-space: nowrap;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.card-title {
  margin: 0 0 0.45rem 0;
  font-size: 1.03rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--text-primary);
}
.card-title-btn {
  background: none;
  border: none;
  padding: 0;
  text-align: left;
  cursor: pointer;
  color: inherit;
  font: inherit;
}
.card-title-btn:hover {
  color: color-mix(in srgb, var(--text-primary) 82%, var(--text-secondary));
}

.card-summary {
  margin: 0;
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.62;
}
.card-context-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.35rem 0.75rem;
  margin-top: 0.6rem;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  font-size: 0.68rem;
}
.card-context-item {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  min-width: 0;
}
.card-context-item svg {
  width: 10px;
  height: 10px;
  flex: 0 0 auto;
}

/* Notion Toggle Disclosure Blocks */
.toggle-block {
  margin-top: 0.85rem;
  border-top: 1px solid var(--border);
  padding-top: 0.8rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.resume-capsule {
  padding: 0.8rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}
.resume-objective {
  font-size: 0.84rem;
  line-height: 1.5;
  color: var(--text-primary);
}
.resume-label {
  display: block;
  margin-bottom: 0.2rem;
  color: var(--text-tertiary);
  font-size: 0.67rem;
  font-weight: 650;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.resume-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.65rem 1rem;
}
.resume-list {
  margin: 0;
  padding-left: 1rem;
  color: var(--text-secondary);
  font-size: 0.78rem;
  line-height: 1.5;
}
@media (max-width: 640px) {
  .resume-grid { grid-template-columns: 1fr; }
}

.toggle-header-btn {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  background: none;
  border: none;
  padding: 0;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  text-align: left;
}
.toggle-header-btn:hover {
  color: var(--text-primary);
}
.toggle-triangle {
  font-size: 0.65rem;
  transition: transform 0.15s ease;
}
.toggle-triangle.open {
  transform: rotate(90deg);
}

.bullet-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.bullet-item {
  display: flex;
  align-items: baseline;
  gap: 0.45rem;
  font-size: 0.8rem;
  color: var(--text-primary);
}
.bullet-dot {
  color: var(--text-tertiary);
}

/* Files Block */
.files-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}
.file-badge-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  background: var(--surface);
  border: 0;
  border-radius: 7px;
  padding: 2px 7px;
  color: var(--text-primary);
  cursor: default;
  transition: all 0.12s ease;
}

/* Tags Block */
.tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.notion-tag {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  background: var(--tag-bg);
  color: var(--tag-text);
  border: 0;
  border-radius: 6px;
  padding: 2px 6px;
}

/* Card Action Footer */
.card-action-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-top: 0.95rem;
  padding-top: 0.7rem;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.action-cluster {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.action-pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  min-height: 30px;
  background: transparent;
  border: 0;
  border-radius: 8px;
  padding: 0.25rem 0.55rem;
  font-size: 0.75rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.12s ease;
}
.action-pill-btn:hover {
  background: var(--surface);
  color: var(--text-primary);
}
.action-pill-btn.active {
  background: var(--surface);
  color: var(--text-primary);
}
.action-pill-btn:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: 1px;
}

.card-inline-panel {
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
}
.inline-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.55rem;
}
.inline-panel-actions {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}
.panel-icon-btn {
  width: 30px;
  min-width: 30px;
  padding: 0;
  justify-content: center;
}
.collapse-icon {
  display: inline-flex;
  transform: rotate(180deg);
}
.inline-panel-title {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.75rem;
  font-weight: 650;
}
.card-inline-panel .code-container {
  max-height: 420px;
  overflow: auto;
}
.card-inline-panel .toggle-block {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}
.command-list {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.command-item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.35rem;
}
.command-item-label {
  color: var(--text-tertiary);
  font-size: 0.68rem;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.id-label {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text-tertiary);
}

/* Copyable text displayed inside expanded card panels. */
.code-container {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  line-height: 1.5;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.85rem;
  margin: 0;
  white-space: pre-wrap;
  color: var(--text-primary);
}
.toast-box {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: var(--card);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 0.45rem 1.1rem;
  font-size: 0.78rem;
  font-weight: 500;
  box-shadow: var(--shadow-float);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: all 0.18s ease;
}
.toast-box.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.empty-block {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3.5rem 1.5rem;
  text-align: center;
  color: var(--text-secondary);
}

@media (max-width: 820px) {
  .nav-bar,
  body.sidebar-shelved .nav-bar {
    width: 100%;
    margin-left: 0;
  }
  .workspace {
    display: block;
  }
  .sidebar {
    position: fixed;
    z-index: 70;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(300px, calc(100vw - 48px));
    height: auto;
    padding: 0 0.8rem 2rem;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    border-bottom: 0;
    box-shadow: var(--shadow-float);
    transform: translateX(-102%);
    visibility: hidden;
    transition: transform 0.2s ease, visibility 0s linear 0.2s;
  }
  body.sidebar-open {
    overflow: hidden;
  }
  body.sidebar-open .sidebar {
    transform: translateX(0);
    visibility: visible;
    transition: transform 0.2s ease;
  }
  .sidebar-backdrop {
    display: block;
    position: fixed;
    z-index: 60;
    inset: 0;
    border: 0;
    padding: 0;
    background: rgba(0, 0, 0, 0.42);
    backdrop-filter: blur(2px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0s linear 0.2s;
  }
  body.sidebar-open .sidebar-backdrop {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 0.2s ease;
  }
  .desktop-sidebar-icon {
    display: none;
  }
  .sidebar-toggle-btn {
    display: inline-flex;
  }
  .top-nav-brand,
  body.sidebar-shelved .top-nav-brand {
    display: flex;
  }
  .mobile-menu-icon {
    display: block;
  }
  .sidebar-shelf-btn .desktop-sidebar-icon {
    display: none;
  }
  .sidebar-shelf-btn .mobile-close-icon {
    display: block;
  }
  .nav-center {
    max-width: 280px;
  }
  .document-main {
    width: 100%;
    padding: 1.75rem 1rem 4rem;
  }
  .views-tabs {
    overflow-x: auto;
    scrollbar-width: none;
  }
  .views-tabs::-webkit-scrollbar {
    display: none;
  }
  .view-tab-btn {
    flex: 0 0 auto;
  }
}

@media (max-width: 560px) {
  .nav-bar {
    padding: 0 0.65rem;
    gap: 0.45rem;
  }
  .top-nav-brand .ultrateam-logo-text,
  .search-shortcut {
    display: none;
  }
  .nav-center {
    max-width: none;
  }
  .search-box {
    padding-right: 2rem;
  }
  .search-clear-btn {
    right: 0.75rem;
  }
  .sidebar {
    width: min(288px, calc(100vw - 44px));
  }
  .properties-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.65rem;
  }
  .property-chip,
  .property-chip:first-child {
    border-right: 0;
    padding: 0;
  }
  .notion-card {
    padding: 1.05rem;
    border-radius: 14px;
  }
}
</style>

<script>
'use strict';

const state = {
  scope: null,
  query: '',
  kindFilter: 'all',
  agentFilters: new Set(),
  expandedPanels: new Map(),
  selectedIndex: -1,
  data: null,
  rawPayload: '',
  seq: 0,
};

const PROVIDER_METADATA = {
  claude:    { icon: '#icon-claude',        color: 'var(--p-anthropic)', name: 'Claude Code' },
  anthropic: { icon: '#icon-claude',        color: 'var(--p-anthropic)', name: 'Anthropic Claude' },
  openai:    { icon: '#icon-openai',        color: 'var(--p-openai)',    name: 'OpenAI' },
  google:    { icon: '#icon-google',        color: 'var(--p-google)',    name: 'Google Gemini' },
  github:    { icon: '#icon-githubcopilot', color: 'var(--p-github)',    name: 'GitHub Copilot' },
  cursor:    { icon: '#icon-cursor',        color: 'var(--p-cursor)',    name: 'Cursor' },
  human:     { icon: '#icon-human',         color: 'var(--p-human)',     name: 'User' },
  other:     { icon: '#icon-file',          color: 'var(--p-other)',     name: 'Agent' },
};

const ENTRY_KIND_METADATA = {
  handoff: { icon: '#icon-handoff', label: 'Handoff' },
  session: { icon: '#icon-check-square', label: 'Checkpoint' },
  note: { icon: '#icon-file', label: 'Note' },
};

function getProviderMeta(agentName, provider) {
  const an = (agentName || '').toLowerCase();
  const pr = (provider || '').toLowerCase();

  if (an.includes('claude') || an.includes('anthropic') || pr.includes('anthropic') || pr.includes('claude')) {
    return PROVIDER_METADATA.claude;
  }
  if (an.includes('copilot') || pr.includes('github') || pr.includes('copilot')) {
    return PROVIDER_METADATA.github;
  }
  if (an.includes('gemini') || an.includes('antigravity') || pr.includes('google')) {
    return PROVIDER_METADATA.google;
  }
  if (an.includes('cursor') || pr.includes('cursor')) {
    return PROVIDER_METADATA.cursor;
  }
  if (an.includes('codex') || an.includes('gpt') || pr.includes('openai')) {
    return PROVIDER_METADATA.openai;
  }
  if (an.includes('human') || pr.includes('human')) {
    return PROVIDER_METADATA.human;
  }
  return PROVIDER_METADATA.other;
}

function getAgentDisplayName(agentName, displayName, providerMeta) {
  if (providerMeta === PROVIDER_METADATA.human && (!displayName || displayName.toLowerCase() === 'human')) {
    return providerMeta.name;
  }
  return displayName || agentName;
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k.startsWith('style') && typeof v === 'string') el.style.cssText = v;
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? '' : v);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined) continue;
    el.append(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return el;
}

function svgIcon(iconId, width = 12, height = 12) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', String(width));
  svg.setAttribute('height', String(height));
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', iconId);
  svg.appendChild(use);
  return svg;
}

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

function setChildren(el, ...children) {
  el.replaceChildren(...children.flat(Infinity).filter((c) => c !== null && c !== undefined));
}

function timeAgo(iso) {
  const ms = Date.now() - Date.parse(iso);
  if (isNaN(ms) || ms < 0) return 'just now';
  const sec = Math.floor(ms / 1000);
  if (sec < 45) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  if (day === 1) return 'yesterday';
  if (day < 30) return `${day}d ago`;
  const mo = Math.floor(day / 30);
  return `${mo}mo ago`;
}

function fullDateTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  } catch {
    return iso;
  }
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

async function fetchState() {
  const currentSeq = ++state.seq;
  const params = new URLSearchParams();
  if (state.scope) params.set('project', state.scope);
  if (state.query) params.set('q', state.query);

  try {
    const res = await fetch('/api/state?' + params.toString());
    if (currentSeq !== state.seq) return;
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.text();
    if (currentSeq !== state.seq) return;
    if (raw === state.rawPayload) return;
    state.rawPayload = raw;
    state.data = JSON.parse(raw);
    if (!state.scope) state.scope = state.data.scope;
    render();
  } catch (err) {
    if (currentSeq !== state.seq) return;
    renderError(err.message);
  }
}

function render() {
  const d = state.data;
  if (!d) return;

  renderOverview(d);
  renderRoster(d);
  renderProjectNav(d);
  renderFeed(d);
  updateThemeIcon();

  const currentProjectName = d.scope === 'all'
    ? 'All Workspaces'
    : (d.projects.find((p) => p.id === d.scope)?.name || 'Workspace');
  $('#page-title-text').textContent = currentProjectName;
  document.title = `ultrateam — ${currentProjectName}`;
}

function renderOverview(d) {
  $('#stat-total').textContent = String(d.stats.entries || 0);
  $('#stat-handoffs').textContent = String(d.stats.handoffs || 0);
  $('#stat-threads').textContent = String(d.stats.openThreads || 0);
  $('#stat-agents').textContent = String(d.agents ? d.agents.length : 0);
}

function renderRoster(d) {
  const list = $('#roster-list');
  const totalEntries = d.stats.entries || 0;
  const isAllActive = state.agentFilters.size === 0;

  const allItem = h('button', {
    class: `agent-item-btn ${isAllActive ? 'active' : ''}`,
    'aria-pressed': String(isAllActive),
    onclick: () => {
      state.agentFilters.clear();
      render();
    },
  },
    h('div', { style: 'display:flex;align-items:center;gap:0.45rem;min-width:0;' },
      h('div', { class: 'agent-icon-badge', style: '--p-color:var(--text-secondary);' },
        svgIcon('#icon-layers', 12, 12)
      ),
      h('span', { class: 'agent-name-text' }, 'All')
    ),
    h('span', { class: 'nav-count-pill' }, String(totalEntries))
  );

  if (!d.agents || d.agents.length === 0) {
    setChildren(list, allItem);
    return;
  }

  const agentItems = d.agents.map((a) => {
    const meta = getProviderMeta(a.name, a.meta?.provider || a.provider);
    const isActive = state.agentFilters.has(a.name);
    const modelsStr = a.models && a.models.length ? a.models.join(', ') : timeAgo(a.lastTs);

    return h('button', {
      class: `agent-item-btn ${isActive ? 'active' : ''}`,
      'aria-pressed': String(isActive),
      onclick: () => {
        if (state.agentFilters.has(a.name)) {
          state.agentFilters.delete(a.name);
        } else {
          state.agentFilters.add(a.name);
        }
        render();
      },
    },
      h('div', { style: 'display:flex;align-items:center;gap:0.45rem;min-width:0;' },
        h('div', { class: 'agent-icon-badge', style: `--p-color:${meta.color};` },
          svgIcon(meta.icon, 13, 13)
        ),
        h('div', { style: 'min-width:0;' },
          h('div', { class: 'agent-name-text' }, getAgentDisplayName(a.name, a.meta?.display, meta)),
          h('div', { class: 'agent-model-text', title: modelsStr }, modelsStr)
        )
      ),
      h('span', { class: 'nav-count-pill' }, String(a.count))
    );
  });

  setChildren(list, allItem, ...agentItems);
}

function renderProjectNav(d) {
  const list = $('#project-nav-list');
  const items = [
    { id: 'all', name: 'All', count: d.stats.entries },
    ...d.projects,
  ];

  setChildren(list, items.map((p) => {
    const isActive = (state.scope === p.id) || (p.id === 'all' && state.scope === 'all');
    return h('button', {
      class: `nav-item-btn ${isActive ? 'active' : ''}`,
      onclick: () => {
        state.scope = p.id;
        fetchState();
      },
    },
      h('div', { class: 'nav-item-left' },
        svgIcon('#icon-folder', 13, 13),
        h('span', { class: 'nav-item-label' }, p.name)
      ),
      h('span', { class: 'nav-count-pill' }, String(p.count || 0))
    );
  }));
}

function renderFeed(d) {
  let entries = d.entries || [];

  const totalHandoffs = entries.filter((e) => e.kind === 'handoff').length;
  const totalSessions = entries.filter((e) => e.kind === 'session').length;
  const totalNotes = entries.filter((e) => e.kind === 'note').length;
  $('#badge-all').textContent = String(entries.length);
  $('#badge-handoff').textContent = String(totalHandoffs);
  $('#badge-session').textContent = String(totalSessions);
  $('#badge-note').textContent = String(totalNotes);

  if (state.kindFilter === 'handoff') entries = entries.filter((e) => e.kind === 'handoff');
  else if (state.kindFilter === 'session') entries = entries.filter((e) => e.kind === 'session');
  else if (state.kindFilter === 'note') entries = entries.filter((e) => e.kind === 'note');

  if (state.agentFilters.size > 0) {
    entries = entries.filter((e) => state.agentFilters.has(e.agent?.name));
  }

  const stream = $('#feed-stream');
  if (entries.length === 0) {
    const reasons = [];
    if (state.query) reasons.push(`search “${state.query}”`);
    if (state.agentFilters.size > 0) reasons.push(`${state.agentFilters.size} selected agent${state.agentFilters.size === 1 ? '' : 's'}`);
    if (state.kindFilter !== 'all') reasons.push(ENTRY_KIND_METADATA[state.kindFilter]?.label.toLowerCase() || state.kindFilter);
    const message = reasons.length > 0
      ? `No entries match ${reasons.join(' and ')} in this workspace.`
      : 'No diary entries in this workspace yet.';
    setChildren(stream,
      h('div', { class: 'empty-block' },
        h('p', { style: 'margin:0;font-size:0.85rem;' }, message),
        reasons.length > 0 ? h('button', {
          class: 'action-pill-btn',
          style: 'margin-top:0.65rem;',
          onclick: resetFilters,
        }, 'Clear filters') : null
      )
    );
    return;
  }

  setChildren(stream, entries.map((entry, index) => renderCard(entry, index, d)));
}

function renderCard(entry, index, d) {
  const providerMeta = getProviderMeta(entry.agent?.name || entry.meta?.display, entry.agent?.provider || entry.meta?.provider);
  const kindMeta = ENTRY_KIND_METADATA[entry.kind] || { icon: '#icon-file', label: entry.kind };
  const activePanel = state.expandedPanels.get(entry.id) || null;
  const isSelected = state.selectedIndex === index;

  const card = h('article', {
    class: `notion-card ${isSelected ? 'selected' : ''}`,
    'data-id': entry.id,
  },
    // Header Line
    h('div', { class: 'card-header-line' },
      h('div', { class: 'card-meta-left' },
        h('div', { class: 'agent-badge-pill' },
          h('div', { class: 'agent-icon-badge', style: `--p-color:${providerMeta.color};` },
            svgIcon(providerMeta.icon, 13, 13)
          ),
          h('span', { class: 'agent-identity-copy' },
            h('span', {}, getAgentDisplayName(entry.agent?.name, entry.meta?.display, providerMeta)),
            entry.agent?.model ? h('span', { class: 'agent-model-inline', title: entry.agent.model }, entry.agent.model) : null
          )
        ),
        h('span', { class: `kind-pill ${entry.kind}` },
          svgIcon(kindMeta.icon, 10, 10),
          h('span', {}, kindMeta.label)
        )
      ),
      h('span', { class: 'card-time', title: fullDateTime(entry.ts) }, timeAgo(entry.ts))
    ),

    // Title & Summary
    h('h3', { class: 'card-title' },
      h('button', {
        class: 'card-title-btn',
        onclick: () => toggleCardPanel(entry.id, 'details'),
      }, entry.title)
    ),
    h('p', { class: 'card-summary' }, entry.summary),
    (entry.branch || (d.scope === 'all' && entry.project)) ? h('div', { class: 'card-context-row' },
      entry.branch ? h('span', { class: 'card-context-item' },
        svgIcon('#icon-branch', 10, 10),
        h('span', {}, entry.branch)
      ) : null,
      d.scope === 'all' && entry.project ? h('span', { class: 'card-context-item' },
        svgIcon('#icon-folder', 10, 10),
        h('span', {}, entry.project)
      ) : null
    ) : null,

    // Stable action selector: every option opens an inline text panel.
    h('div', { class: 'card-action-bar' },
      h('div', { class: 'action-cluster' },
        h('button', {
          class: `action-pill-btn ${activePanel === 'details' ? 'active' : ''}`,
          'aria-expanded': String(activePanel === 'details'),
          onclick: () => toggleCardPanel(entry.id, 'details'),
        }, 'Details'),
        h('button', {
          class: `action-pill-btn ${activePanel === 'commands' ? 'active' : ''}`,
          'aria-expanded': String(activePanel === 'commands'),
          onclick: () => toggleCardPanel(entry.id, 'commands'),
        }, 'Commands'),
        h('button', {
          class: `action-pill-btn ${activePanel === 'json' ? 'active' : ''}`,
          'aria-expanded': String(activePanel === 'json'),
          onclick: () => toggleCardPanel(entry.id, 'json'),
        }, 'JSON')
      ),
      h('span', { class: 'id-label' }, entry.id.slice(0, 10) + '…')
    ),
    activePanel ? renderCardPanel(entry, activePanel) : null
  );

  return card;
}

function renderResumeCapsule(resume) {
  const list = (label, items) => items && items.length ? h('div', {},
    h('span', { class: 'resume-label' }, label),
    h('ul', { class: 'resume-list' }, items.map((item) => h('li', {}, item)))
  ) : null;
  const gitFacts = resume.git ? [
    `Branch: ${resume.git.branch || 'detached/unknown'}`,
    `HEAD: ${resume.git.head ? resume.git.head.slice(0, 12) : 'unknown'}`,
    `Working tree: ${resume.git.dirty ? 'dirty' : 'clean'}`,
    ...(resume.git.changed_files || []).map((file) => `Changed: ${file}`),
  ] : [];
  return h('section', { class: 'resume-capsule' },
    h('div', { class: 'resume-objective' },
      h('span', { class: 'resume-label' }, 'Resume objective'),
      resume.objective
    ),
    h('div', { class: 'resume-grid' },
      list('Completed', resume.completed),
      list('Next steps', resume.next_steps),
      list('Blockers', resume.blockers),
      list('Verification', resume.verification),
      list('Useful commands', resume.commands),
      list('Captured Git state', gitFacts)
    )
  );
}

function renderCardPanel(entry, panel) {
  const detailsText = formatEntryText(entry);
  const jsonText = JSON.stringify(entry, null, 2);
  const isCommands = panel === 'commands';
  const config = panel === 'json'
    ? { title: 'Entry JSON', text: jsonText, copyLabel: 'Copy JSON' }
    : panel === 'details'
      ? { title: 'Entry details', text: detailsText, copyLabel: 'Copy details' }
      : { title: 'Commands', text: '', copyLabel: '' };

  return h('section', { class: 'card-inline-panel', 'data-panel': panel },
    h('div', { class: 'inline-panel-header' },
      h('h4', { class: 'inline-panel-title' }, config.title),
      h('div', { class: 'inline-panel-actions' },
        !isCommands ? h('button', {
          class: 'action-pill-btn panel-icon-btn',
          title: config.copyLabel,
          'aria-label': config.copyLabel,
          onclick: () => copyText(config.text, `${config.copyLabel.replace('Copy ', '')} copied`),
        }, svgIcon('#icon-copy', 12, 12)) : null,
        h('button', {
          class: 'action-pill-btn panel-icon-btn',
          title: `Collapse ${config.title.toLowerCase()}`,
          'aria-label': `Collapse ${config.title.toLowerCase()}`,
          onclick: () => toggleCardPanel(entry.id, panel),
        }, h('span', { class: 'collapse-icon' }, svgIcon('#icon-chevron', 14, 14)))
      )
    ),
    panel === 'details'
      ? renderEntryDetails(entry)
      : isCommands
        ? renderCommands(entry)
        : h('pre', { class: 'code-container' }, config.text)
  );
}

function renderCommands(entry) {
  const commands = [
    { label: 'Show entry', value: `ultrateam show ${entry.id}` },
    ...(entry.resume || entry.kind === 'handoff'
      ? [{ label: 'Resume work', value: `ultrateam resume --id ${entry.id}` }]
      : []),
  ];
  return h('div', { class: 'command-list' }, commands.map((command) =>
    h('div', { class: 'command-item' },
      h('div', { class: 'command-item-header' },
        h('span', { class: 'command-item-label' }, command.label),
        h('button', {
          class: 'action-pill-btn panel-icon-btn',
          title: `Copy ${command.label.toLowerCase()} command`,
          'aria-label': `Copy ${command.label.toLowerCase()} command`,
          onclick: () => copyText(command.value, 'Command copied'),
        }, svgIcon('#icon-copy', 12, 12))
      ),
      h('pre', { class: 'code-container' }, command.value)
    )
  ));
}

function renderEntryDetails(entry) {
  return h('div', { class: 'toggle-block' },
    entry.resume ? renderResumeCapsule(entry.resume) : null,
    entry.open_threads && entry.open_threads.length > 0 ? h('div', {},
      h('div', { style: 'font-weight:600;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.25rem;' }, 'Open Items Recorded'),
      h('ul', { class: 'bullet-list' }, entry.open_threads.map((item) =>
        h('li', { class: 'bullet-item' }, h('span', { class: 'bullet-dot' }, '•'), h('span', {}, item))
      ))
    ) : null,
    entry.decisions && entry.decisions.length > 0 ? h('div', {},
      h('div', { style: 'font-weight:600;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.25rem;' }, 'Decisions & Rationale'),
      h('ul', { class: 'bullet-list' }, entry.decisions.map((dec) =>
        h('li', { class: 'bullet-item' }, h('span', { class: 'bullet-dot' }, '•'), h('span', {}, dec))
      ))
    ) : null,
    entry.files && entry.files.length > 0 ? h('div', {},
      h('div', { style: 'font-weight:600;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.25rem;' }, `Files Touched (${entry.files.length})`),
      h('div', { class: 'files-grid' }, entry.files.map((file) =>
        h('span', { class: 'file-badge-btn' }, svgIcon('#icon-file', 10, 10), h('span', {}, file))
      ))
    ) : null,
    entry.tags && entry.tags.length > 0 ? h('div', { class: 'tags-row' },
      entry.tags.map((tag) => h('span', { class: 'notion-tag' }, `#${tag}`))
    ) : null
  );
}

function formatEntryText(entry) {
  const lines = [entry.title, '', entry.summary];
  const add = (label, items) => {
    if (!items || items.length === 0) return;
    lines.push('', `${label}:`, ...items.map((item) => `- ${item}`));
  };
  add('Decisions', entry.decisions);
  add('Files', entry.files);
  add('Open threads recorded at handoff', entry.open_threads);
  add('Tags', entry.tags);
  return lines.join('\n');
}

function toggleCardPanel(id, panel = 'details') {
  if (state.expandedPanels.get(id) === panel) state.expandedPanels.delete(id);
  else state.expandedPanels.set(id, panel);
  render();
}

function resetFilters() {
  state.query = '';
  state.agentFilters.clear();
  state.kindFilter = 'all';
  $('#search-input').value = '';
  $('#search-clear').style.display = 'none';
  $$('.view-tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.kind === 'all'));
  fetchState();
}

let toastTimer = null;
function showToast(msg) {
  const toast = $('#toast-hud');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

function copyText(text, msg = 'Copied to clipboard') {
  navigator.clipboard.writeText(text).then(() => {
    showToast(msg);
  }).catch(() => {
    const t = document.createElement('textarea');
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
    showToast(msg);
  });
}

function renderError(msg) {
  setChildren($('#feed-stream'),
    h('div', { class: 'empty-block' },
      h('p', {}, `Unable to reach ultrateam viewer server: ${msg}`),
      h('button', { class: 'action-pill-btn', style: 'margin-top:0.5rem;', onclick: fetchState }, 'Retry')
    )
  );
}

let searchTimer = null;
const searchInput = $('#search-input');
const searchClear = $('#search-clear');

searchInput.addEventListener('input', (ev) => {
  const val = ev.target.value.trim();
  searchClear.style.display = val ? 'block' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = val;
    fetchState();
  }, 220);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  state.query = '';
  fetchState();
  searchInput.focus();
});

$$('.view-tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    $$('.view-tab-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    state.kindFilter = btn.dataset.kind;
    render();
  });
});

function toggleTheme() {
  document.documentElement.classList.add('disable-transitions');
  const cur = document.documentElement.dataset.theme;
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('ut-theme', next); } catch {}
  updateThemeIcon();

  // Force reflow and restore hover transitions cleanly in the next frame
  window.getComputedStyle(document.documentElement).opacity;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.documentElement.classList.remove('disable-transitions');
    });
  });
}

function updateThemeIcon() {
  const isLight = document.documentElement.dataset.theme === 'light' ||
    (!document.documentElement.dataset.theme && !matchMedia('(prefers-color-scheme: dark)').matches);
  const iconUse = $('#theme-icon use');
  if (iconUse) {
    iconUse.setAttribute('href', isLight ? '#icon-moon' : '#icon-sun');
  }
  const btn = $('#theme-btn');
  if (btn) {
    btn.title = isLight ? 'Switch to dark mode' : 'Switch to light mode';
    btn.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
  }
}

const filterSidebar = $('#filter-sidebar');
const workspaceShell = $('#workspace-shell');
const sidebarToggle = $('#sidebar-toggle');
const sidebarShelf = $('#sidebar-shelf');
const sidebarBackdrop = $('#sidebar-backdrop');
const mobileSidebarQuery = matchMedia('(max-width: 820px)');

function updateSidebarToggle() {
  const isMobile = mobileSidebarQuery.matches;
  const isVisible = isMobile
    ? document.body.classList.contains('sidebar-open')
    : !workspaceShell.classList.contains('sidebar-shelved');
  const label = isMobile
    ? (isVisible ? 'Close navigation' : 'Open navigation')
    : (isVisible ? 'Hide sidebar' : 'Show sidebar');
  sidebarToggle.setAttribute('aria-expanded', String(isVisible));
  sidebarToggle.setAttribute('aria-label', label);
  sidebarToggle.title = label;
  const shelfLabel = isMobile ? 'Close navigation' : 'Hide sidebar';
  sidebarShelf.setAttribute('aria-label', shelfLabel);
  sidebarShelf.title = shelfLabel;
}

function setMobileSidebarOpen(open) {
  document.body.classList.toggle('sidebar-open', open);
  updateSidebarToggle();
}

function setSidebarShelved(shelved) {
  document.body.classList.toggle('sidebar-shelved', shelved);
  workspaceShell.classList.toggle('sidebar-shelved', shelved);
  try { localStorage.setItem('ut-sidebar-shelved', String(shelved)); } catch {}
  updateSidebarToggle();
}

sidebarToggle.addEventListener('click', () => {
  if (mobileSidebarQuery.matches) {
    setMobileSidebarOpen(!document.body.classList.contains('sidebar-open'));
  } else {
    setSidebarShelved(false);
  }
});

sidebarShelf.addEventListener('click', () => {
  if (mobileSidebarQuery.matches) {
    setMobileSidebarOpen(false);
    sidebarToggle.focus();
  } else {
    setSidebarShelved(true);
    sidebarToggle.focus();
  }
});

sidebarBackdrop.addEventListener('click', () => setMobileSidebarOpen(false));

filterSidebar.addEventListener('click', (ev) => {
  if (ev.target.closest('.agent-item-btn, .nav-item-btn') && mobileSidebarQuery.matches) {
    setMobileSidebarOpen(false);
  }
});

mobileSidebarQuery.addEventListener('change', () => {
  setMobileSidebarOpen(false);
  updateSidebarToggle();
});

$('#theme-btn').addEventListener('click', toggleTheme);

try {
  const savedTheme = localStorage.getItem('ut-theme');
  if (savedTheme === 'dark' || savedTheme === 'light') {
    document.documentElement.dataset.theme = savedTheme;
  }
  if (localStorage.getItem('ut-sidebar-shelved') === 'true') {
    document.body.classList.add('sidebar-shelved');
    workspaceShell.classList.add('sidebar-shelved');
  }
  updateThemeIcon();
  updateSidebarToggle();
} catch {}

window.addEventListener('keydown', (ev) => {
  if (document.activeElement === searchInput) {
    if (ev.key === 'Escape') {
      searchInput.blur();
      if (searchInput.value) {
        searchInput.value = '';
        state.query = '';
        fetchState();
      }
    }
    return;
  }

  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k' || ev.key === '/') {
    ev.preventDefault();
    searchInput.focus();
    searchInput.select();
    return;
  }

  if (ev.key === 'Escape') {
    if (document.body.classList.contains('sidebar-open')) {
      setMobileSidebarOpen(false);
      sidebarToggle.focus();
      return;
    }
    const selectedCard = $$('.notion-card')[state.selectedIndex];
    if (selectedCard?.dataset.id && state.expandedPanels.has(selectedCard.dataset.id)) {
      state.expandedPanels.delete(selectedCard.dataset.id);
      render();
    }
    return;
  }

  if (ev.key.toLowerCase() === 't' && !ev.metaKey && !ev.ctrlKey) {
    toggleTheme();
    return;
  }

  const posts = $$('.notion-card');
  if (posts.length === 0) return;

  if (ev.key.toLowerCase() === 'j') {
    state.selectedIndex = Math.min(posts.length - 1, state.selectedIndex + 1);
    posts[state.selectedIndex]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    render();
  } else if (ev.key.toLowerCase() === 'k') {
    state.selectedIndex = Math.max(0, state.selectedIndex - 1);
    posts[state.selectedIndex]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    render();
  } else if (ev.key.toLowerCase() === 'o' || ev.key === 'Enter') {
    const activeCard = posts[state.selectedIndex];
    if (activeCard) {
      const id = activeCard.dataset.id;
      toggleCardPanel(id, 'details');
    }
  }
});

setInterval(() => {
  if (!document.hidden && !state.query) {
    fetchState();
  }
}, 10000);

fetchState();
</script>
</body>
</html>
