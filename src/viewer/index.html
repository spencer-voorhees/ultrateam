<script>
'use strict';

const urlParams = new URLSearchParams(window.location.search);
const initialProject = urlParams.get('project');
const initialQuery = urlParams.get('q') || '';

const state = {
  scope: initialProject && initialProject !== 'all' ? initialProject : null,
  query: initialQuery,
  kindFilter: 'all',
  agentFilters: new Set(),
  expandedPanels: new Map(),
  selectedEntryId: null,
  data: null,
  rawPayload: '',
  seq: 0,
  newEntryIds: new Set(),
  collapsedThreads: new Set(),
  threadExpanded: new Set(),
  threadShowAll: new Set(),
  freshThreads: new Set(),
  lastThreadKeys: [],
  feedView: (() => { try { return localStorage.getItem('ut-feed-view') === 'threads' ? 'threads' : 'timeline'; } catch { return 'timeline'; } })(),
};

const PROVIDER_METADATA = {
  claude:    { icon: '#icon-claude',        color: 'var(--p-anthropic)', name: 'Claude Code' },
  anthropic: { icon: '#icon-claude',        color: 'var(--p-anthropic)', name: 'Anthropic Claude' },
  openai:    { icon: '#icon-openai',        color: 'var(--p-openai)',    name: 'OpenAI' },
  google:    { icon: '#icon-google',        color: 'var(--p-google)',    name: 'Google Gemini' },
  github:    { icon: '#icon-githubcopilot', color: 'var(--p-github)',    name: 'GitHub Copilot' },
  cursor:    { icon: '#icon-cursor',        color: 'var(--p-cursor)',    name: 'Cursor' },
  human:     { icon: '#icon-human',         color: 'var(--p-human)',     name: 'User' },
  other:     { icon: '#icon-file',          color: 'var(--p-other)',     name: 'Agent' },
};

const ENTRY_KIND_METADATA = {
  handoff: { icon: '#icon-handoff', label: 'Handoff' },
  session: { icon: '#icon-check-square', label: 'Checkpoint' },
  note: { icon: '#icon-file', label: 'Note' },
};

function getProviderMeta(agentName, provider) {
  const an = (agentName || '').toLowerCase();
  const pr = (provider || '').toLowerCase();

  // The agent NAME identifies the tool and must win over the model's provider:
  // Cursor running a Claude model records provider 'anthropic' but is still
  // Cursor, so it must not resolve to the Claude icon.
  if (an.includes('cursor')) return PROVIDER_METADATA.cursor;
  if (an.includes('copilot')) return PROVIDER_METADATA.github;
  if (an.includes('antigravity') || an.includes('gemini')) return PROVIDER_METADATA.google;
  if (an.includes('codex') || an.includes('gpt')) return PROVIDER_METADATA.openai;
  if (an.includes('claude') || an.includes('anthropic')) return PROVIDER_METADATA.claude;
  if (an.includes('human')) return PROVIDER_METADATA.human;

  // Only when the name isn't a known tool do we fall back to the model provider.
  if (pr.includes('cursor')) return PROVIDER_METADATA.cursor;
  if (pr.includes('github') || pr.includes('copilot')) return PROVIDER_METADATA.github;
  if (pr.includes('google')) return PROVIDER_METADATA.google;
  if (pr.includes('openai')) return PROVIDER_METADATA.openai;
  if (pr.includes('anthropic') || pr.includes('claude')) return PROVIDER_METADATA.claude;
  if (pr.includes('human')) return PROVIDER_METADATA.human;
  return PROVIDER_METADATA.other;
}

function getAgentDisplayName(agentName, displayName, providerMeta) {
  if (providerMeta === PROVIDER_METADATA.human && (!displayName || displayName.toLowerCase() === 'human')) {
    return providerMeta.name;
  }
  return displayName || agentName;
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k.startsWith('style') && typeof v === 'string') el.style.cssText = v;
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? '' : v);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined) continue;
    el.append(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return el;
}

function svgIcon(iconId, width = 12, height = 12) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', String(width));
  svg.setAttribute('height', String(height));
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', iconId);
  svg.appendChild(use);
  return svg;
}

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

function setChildren(el, ...children) {
  el.replaceChildren(...children.flat(Infinity).filter((c) => c !== null && c !== undefined));
}

function timeAgo(iso) {
  const ms = Date.now() - Date.parse(iso);
  if (isNaN(ms) || ms < 0) return 'just now';
  const sec = Math.floor(ms / 1000);
  if (sec < 45) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  if (day === 1) return 'yesterday';
  if (day < 30) return `${day}d ago`;
  const mo = Math.floor(day / 30);
  return `${mo}mo ago`;
}

function fullDateTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  } catch {
    return iso;
  }
}

// ---- Contributions drawer ---------------------------------------------------
// Reuses the drawer shell (usage-* ids/classes) but shows each agent's
// contribution computed from the shared memory itself — reliable for every
// provider, with no external logs or APIs.
const statsState = { open: false, expanded: null, lastReport: null };

function fmtNum(n) {
  n = n || 0;
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 10_000) return (n / 1_000).toFixed(1) + 'K';
  return String(n);
}

function openUsage() {
  const drawer = $('#usage-drawer'), backdrop = $('#usage-backdrop');
  drawer.hidden = false; backdrop.hidden = false;
  requestAnimationFrame(() => { drawer.classList.add('open'); backdrop.classList.add('open'); });
  $('#usage-close').focus();
  statsState.open = true;
  loadStats();
}
function closeUsage() {
  const drawer = $('#usage-drawer'), backdrop = $('#usage-backdrop');
  drawer.classList.remove('open'); backdrop.classList.remove('open');
  setTimeout(() => { drawer.hidden = true; backdrop.hidden = true; }, 260);
  statsState.open = false;
  const btn = $('#usage-btn'); if (btn) btn.focus();
}

// Contributions always reflect ALL workspaces, so prefer the warm "All" snapshot
// over the scoped view (falling back to current data, then a fetch).
function renderStatsSkeleton() {
  const bar = (w, ht, mt) => h('div', { class: 'skeleton-bar', style: `width:${w};height:${ht};${mt ? 'margin-top:' + mt + ';' : ''}` });
  const total = h('div', { class: 'usage-total' },
    h('div', { style: 'width:100%;' }, bar('42%', '1.5rem'), bar('62%', '0.8rem', '0.55rem'))
  );
  const card = () => h('div', { class: 'usage-card' },
    h('div', { class: 'usage-card-head' },
      h('div', { class: 'skeleton-bar', style: 'width:28px;height:28px;border-radius:8px;flex:0 0 auto;' }),
      bar('38%', '0.9rem')
    ),
    h('div', { style: 'margin:0.6rem 0;' }, bar('46%', '1.1rem')),
    h('div', { class: 'stats-share' }, h('span', { class: 'skeleton-bar', style: 'display:block;height:100%;width:55%;' })),
    h('div', { style: 'display:flex;gap:0.35rem;margin-top:0.1rem;' }, bar('24%', '1rem'), bar('28%', '1rem'), bar('20%', '1rem'))
  );
  return [total, card(), card(), card()];
}

async function loadStats() {
  const body = $('#usage-drawer-body');
  setChildren(body, ...renderStatsSkeleton());
  try {
    // The server aggregates over ALL entries (never the capped feed), so counts
    // reflect the whole history rather than the recent 200 shown in the feed.
    const report = await (await fetch('/api/contributions')).json();
    if (!statsState.open) return;
    renderStats(report);
  } catch (err) {
    setChildren(body, h('div', { class: 'usage-empty' }, 'Could not load contributions: ' + err.message));
  }
}

function renderStats(report) {
  statsState.lastReport = report; // kept so expand/collapse can re-render without refetching
  const body = $('#usage-drawer-body');
  const list = (report && report.agents) || [];
  if (!list.length) {
    setChildren(body, h('div', { class: 'usage-empty' }, 'No contributions logged yet.'));
    return;
  }
  const totalEntries = list.reduce((s, a) => s + a.count, 0);
  const workspaces = report.workspaces || 0;
  const total = h('div', { class: 'usage-total' },
    h('div', {},
      h('div', { class: 'usage-total-figure' }, fmtNum(totalEntries)),
      h('div', { class: 'usage-total-label' }, `${list.length} agent${list.length === 1 ? '' : 's'} · ${workspaces} workspace${workspaces === 1 ? '' : 's'}`)
    )
  );
  setChildren(body, total, ...list.map((a) => renderStatsCard(a, totalEntries)));
}

function renderStatsCard(a, totalEntries) {
  const meta = getProviderMeta(a.name, a.provider);
  const share = totalEntries ? Math.round((a.count / totalEntries) * 100) : 0;
  const expanded = statsState.expanded === a.name;
  const head = h('button', {
      class: 'usage-card-head usage-card-toggle',
      'aria-expanded': String(expanded),
      title: expanded ? 'Hide model breakdown' : 'Show model breakdown',
      onclick: () => {
        // Accordion: opening a card closes whichever one was open.
        statsState.expanded = expanded ? null : a.name;
        if (statsState.lastReport) renderStats(statsState.lastReport);
      },
    },
    h('span', { class: 'usage-card-avatar', style: `--p-color:${meta.color};` }, svgIcon(meta.icon, 15, 15)),
    h('span', { class: 'usage-card-name' }, getAgentDisplayName(a.name, a.meta && a.meta.display, meta)),
    h('span', { class: 'usage-card-status' }, a.lastTs ? timeAgo(a.lastTs) : ''),
    h('span', { class: `usage-card-chevron${expanded ? ' is-open' : ''}` }, svgIcon('#icon-chevron', 13, 13))
  );
  const figure = h('div', { class: 'usage-card-figure' },
    h('span', { class: 'usage-card-tokens' }, `${fmtNum(a.count)} entr${a.count === 1 ? 'y' : 'ies'}`),
    h('span', { class: 'usage-card-cost' }, share + '%'),
    h('span', { class: 'usage-card-meta' }, `${a.workspaces} workspace${a.workspaces === 1 ? '' : 's'}`)
  );
  const bar = h('div', { class: 'stats-share' }, h('span', { class: 'stats-share-fill', style: `--p-color:${meta.color};width:${Math.max(3, share)}%` }));
  const chips = [];
  const chip = (n, label) => { if (n > 0) chips.push(h('span', { class: 'stats-chip' }, h('b', {}, fmtNum(n)), ' ' + label)); };
  chip(a.handoffs, a.handoffs === 1 ? 'handoff' : 'handoffs');
  chip(a.checkpoints, a.checkpoints === 1 ? 'checkpoint' : 'checkpoints');
  chip(a.notes, a.notes === 1 ? 'note' : 'notes');
  chip(a.files, a.files === 1 ? 'file' : 'files');
  chip(a.decisions, a.decisions === 1 ? 'decision' : 'decisions');
  chip(a.openThreads, a.openThreads === 1 ? 'open thread' : 'open threads');
  return h('div', { class: `usage-card${expanded ? ' expanded' : ''}`, style: `--p-color:${meta.color};` },
    head, figure, bar,
    chips.length ? h('div', { class: 'stats-chips' }, ...chips) : null,
    expanded ? renderModelBreakdown(a) : null
  );
}

function renderModelBreakdown(a) {
  // Older servers omit models entirely — treat the whole count as unattributed.
  const list = (a.models && a.models.length) ? a.models : [{ model: null, count: a.count }];
  return h('div', { class: 'usage-card-models' },
    list.map(({ model, count }) => {
      const pct = a.count ? Math.round((count / a.count) * 100) : 0;
      return h('div', { class: 'usage-model-row' },
        model
          ? h('span', { class: 'usage-model-name', title: model }, model)
          : h('span', { class: 'usage-model-name usage-model-none' }, 'no model recorded'),
        h('span', { class: 'usage-model-bar' },
          h('span', { class: 'usage-model-bar-fill', style: `width:${Math.max(2, pct)}%;` })),
        h('span', { class: 'usage-model-count' }, `${fmtNum(count)} · ${pct}%`)
      );
    })
  );
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

let isInitialFetch = true;

function skeletonCard(w) {
  return h('div', { class: 'notion-card skeleton-card', 'aria-hidden': 'true' },
    h('div', { class: 'skeleton-bar', style: `width:${w[0]}%;height:16px;margin-bottom:0.85rem;border-radius:9999px;` }),
    h('div', { class: 'skeleton-bar', style: `width:${w[1]}%;height:20px;margin-bottom:0.65rem;border-radius:6px;` }),
    h('div', { class: 'skeleton-bar', style: `width:${w[2]}%;height:14px;margin-bottom:0.45rem;border-radius:4px;` }),
    h('div', { class: 'skeleton-bar', style: `width:${w[3]}%;height:14px;border-radius:4px;` })
  );
}

// Placeholder feed shown while a fresh workspace loads (switch with no cache),
// instead of dimming the previous workspace's entries.
function renderSkeletonFeed() {
  const widths = [[28, 55, 88, 70], [32, 48, 80, 62], [26, 60, 84, 66], [30, 52, 90, 58]];
  setChildren($('#feed-stream'), ...widths.map(skeletonCard));
}

// Filter the complete "All" snapshot down to one workspace, entirely client-side,
// so switching is instant and never waits on the server. The server response
// later trues this up (for anything beyond the loaded set).
function deriveScopedView(source, scopeId) {
  if (!source || !Array.isArray(source.projects) || !scopeId || scopeId === 'all') return null;
  if (source.scope && source.scope !== 'all') return null; // only a superset can be filtered
  const proj = source.projects.find((p) => p.id === scopeId);
  if (!proj) return null;
  const roots = new Set((proj.roots && proj.roots.length) ? proj.roots : [proj.path]);
  // Workspace id is the reliable join; the path check covers cached snapshots
  // from servers that did not yet send entry.workspaceId.
  const entries = (source.entries || []).filter((e) => e.workspaceId === scopeId || roots.has(e.projectPath));
  const agents = new Map();
  for (const e of entries) {
    const nm = e.agent && e.agent.name;
    if (!nm) continue;
    const cur = agents.get(nm) || { name: nm, count: 0, meta: { provider: e.agent && e.agent.provider } };
    cur.count++;
    agents.set(nm, cur);
  }
  return {
    scope: scopeId,
    query: null,
    projects: source.projects,
    entries,
    stats: {
      entries: proj.count != null ? proj.count : entries.length,
      handoffs: entries.filter((e) => e.kind === 'handoff').length,
      openThreads: entries.reduce((n, e) => n + ((e.open_threads && e.open_threads.length) || 0), 0),
    },
    activityTs: entries.map((e) => e.ts).filter(Boolean),
    agents: [...agents.values()].sort((a, b) => b.count - a.count),
  };
}

// Keep a fresh "All" snapshot in sessionStorage so switches can filter it even
// when the app launched straight into a single workspace.
async function warmAllCache() {
  try {
    const res = await fetch('/api/state?project=all');
    if (res.ok) {
      sessionStorage.setItem('ut-state-cache:all', await res.text());
      // The snapshot is now available, so the roster can show the full agent union.
      if (state.data) renderRoster(state.data);
    }
  } catch (e) {}
}

async function fetchState({ transition = false } = {}) {
  const currentSeq = ++state.seq;
  const params = new URLSearchParams();
  if (state.scope) params.set('project', state.scope);
  if (state.query) params.set('q', state.query);
  // Reflect the current scope in the URL right away, so a reload restores the
  // workspace you switched to — even when the fetch short-circuits on a cache hit.
  syncUrl();
  const stream = $('#feed-stream');

  // Instant switch: paint immediately from data we already have, then revalidate
  // in the background — no round-trip on the switch itself, no dim, no waiting.
  let servedInstant = false;
  if (transition && state.scope && state.scope !== 'all') {
    // 1. Filter the complete "All" snapshot client-side.
    try {
      const allRaw = sessionStorage.getItem('ut-state-cache:all');
      if (allRaw) {
        const derived = deriveScopedView(JSON.parse(allRaw), state.scope);
        if (derived) { state.data = derived; render({ animateStats: false }); servedInstant = true; }
      }
    } catch (e) {}
  }
  if (transition && !servedInstant) {
    // 2. Fall back to this scope's own cached response.
    try {
      const cached = sessionStorage.getItem(`ut-state-cache:${state.scope || 'all'}`);
      if (cached && cached !== state.rawPayload) {
        state.rawPayload = cached;
        state.data = JSON.parse(cached);
        if (!state.scope) state.scope = state.data.scope;
        render({ animateStats: false });
        servedInstant = true;
      }
    } catch (e) {}
  }
  if (transition && !servedInstant) {
    // No cached data to paint, but the selection itself must not wait on the
    // network — reflect the new scope in the left nav and top bar right away.
    renderSkeletonFeed();
    if (state.data) {
      renderProjectNav(state.data);
      const scoped = state.data.projects?.find((p) => p.id === state.scope);
      if (scoped) $('#top-workspace').textContent = projectLabel(scoped);
    }
  }

  try {
    const res = await fetch('/api/state?' + params.toString());
    if (currentSeq !== state.seq) return;
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.text();
    if (currentSeq !== state.seq) return;
    if (raw === state.rawPayload) return;
    const nextData = JSON.parse(raw);
    // "New" badges only make sense when this response is a like-for-like
    // refresh of what's on screen. Comparing across a scope change or a
    // search being applied/cleared would mark every re-appearing entry as
    // new (the classic case: clear a search, the full list "arrives").
    const comparable = state.data && !transition
      && (state.data.scope ?? null) === (nextData.scope ?? null)
      && (state.data.query ?? null) === (nextData.query ?? null);
    const previousIds = new Set((state.data?.entries || []).map((entry) => entry.id));
    const arrivals = comparable
      ? (nextData.entries || []).filter((entry) => !previousIds.has(entry.id))
      : [];
    state.newEntryIds = new Set(arrivals.map((entry) => entry.id));
    markFreshThreads(arrivals);
    state.rawPayload = raw;
    state.data = nextData;
    if (!state.scope) state.scope = state.data.scope;

    // Cache only unfiltered snapshots: a search response stored under the
    // scope's key would clobber the warm snapshot that makes clearing the
    // search (and workspace switching) paint instantly.
    if (!nextData.query) {
      try {
        const cacheKey = `ut-state-cache:${state.scope || 'all'}`;
        sessionStorage.setItem(cacheKey, raw);
      } catch (e) {}
    }

    syncUrl();
    render({ animateStats: !isInitialFetch });
  } catch (err) {
    if (currentSeq !== state.seq) return;
    if (!state.data) renderError(err.message);
  } finally {
    isInitialFetch = false;
    // Whichever request is the latest clears the dim, so a background poll
    // finishing mid-switch can't leave the feed stuck at reduced opacity.
    if (currentSeq === state.seq) {
      requestAnimationFrame(() => stream.classList.remove('feed-refreshing'));
    }
  }
}

function syncUrl() {
  if (typeof window === 'undefined' || !window.history?.replaceState) return;
  const url = new URL(window.location.href);
  if (state.scope && state.scope !== 'all') {
    url.searchParams.set('project', state.scope);
  } else {
    url.searchParams.delete('project');
  }
  if (state.query) {
    url.searchParams.set('q', state.query);
  } else {
    url.searchParams.delete('q');
  }
  const next = url.pathname + (url.search ? url.search : '') + url.hash;
  window.history.replaceState(null, '', next);
}

function renderWithFeedTransition() {
  // Filtering is instant and client-side; render directly. (No feed-refreshing
  // dim — its rAF-based removal could intermittently leave the feed dimmed.)
  render({ animateStats: true });
}

function render({ animateStats = false } = {}) {
  const d = state.data;
  if (!d) return;

  annotateProjectNames(d.projects);
  state.workspaceLabelByPath = buildWorkspaceNameIndex(d);
  state.workspaceColorByPath = buildWorkspaceColorIndex(d);
  state.workspaceLabelById = new Map((d.projects || []).map((p) => [p.id, projectLabel(p)]));
  state.workspaceColorById = new Map((d.projects || []).filter((p) => p.color).map((p) => [p.id, p.color]));
  state.hiddenWorkspaceIds = new Set((d.projects || []).filter((p) => p.hidden).map((p) => p.id));
  renderOverview(d, { animateStats });
  renderRoster(d);
  renderProjectNav(d);
  renderFeed(d, { animateStats });
  updateThemeIcon();
  requestAnimationFrame(() => state.newEntryIds.clear());

  const scoped = d.projects.find((p) => p.id === d.scope);
  const currentProjectName = d.projects.length === 0
    ? 'No workspaces yet'
    : d.scope === 'all'
      ? 'All Workspaces'
      : (scoped ? projectLabel(scoped) : 'Workspace');
  $('#top-workspace').textContent = currentProjectName;
  $('#top-workspace').title = (d.scope !== 'all' && scoped && scoped.path) ? scoped.path : '';
  document.title = 'ultrateam';
}

function renderOverview(d, { animateStats = false } = {}) {
  setCount('#stat-total', d.stats.entries || 0, animateStats);
  setCount('#stat-handoffs', d.stats.handoffs || 0, animateStats);
  setCount('#stat-threads', d.stats.openThreads || 0, animateStats);
  setCount('#stat-agents', d.agents ? d.agents.length : 0, animateStats);
}

function setCount(selector, value, animate = false) {
  const el = $(selector);
  if (!el) return;
  const next = String(value);
  if (el.textContent === next) return;
  el.textContent = next;
  if (!animate) return;
  el.classList.remove('count-updated');
  void el.offsetWidth;
  el.classList.add('count-updated');
}

// Case-insensitive key so "cursor" and "Cursor" are the same agent.
function agentKey(name) { return (name || '').trim().toLowerCase(); }

// The roster is a stable union of every agent with at least one entry across all
// workspaces (from the "All" snapshot), deduped case-insensitively. Switching a
// workspace only changes the counts, never adds/removes rows or flips casing.
function getAllAgentsUnion(d) {
  let snap = [];
  try {
    const allRaw = sessionStorage.getItem('ut-state-cache:all');
    if (allRaw) { const s = JSON.parse(allRaw); if (Array.isArray(s.agents)) snap = s.agents; }
  } catch (e) {}
  const merged = new Map();
  const add = (a, fromSnapshot) => {
    const k = agentKey(a.name);
    if (!k) return;
    const cur = merged.get(k);
    if (!cur) {
      merged.set(k, { key: k, name: a.name, display: a.meta?.display, provider: a.meta?.provider || a.provider, order: fromSnapshot ? (a.count || 0) : 0 });
    } else {
      if (fromSnapshot) cur.order = a.count || 0;
      if (!/[A-Z]/.test(cur.name) && /[A-Z]/.test(a.name)) cur.name = a.name; // prefer "Cursor" over "cursor"
      if (!cur.display && a.meta?.display) cur.display = a.meta.display; // pretty name from the server
      if (!cur.provider) cur.provider = a.meta?.provider || a.provider;
    }
  };
  for (const a of snap) add(a, true);
  for (const a of (d.agents || [])) add(a, false); // include any current-scope agent not yet in the snapshot
  return [...merged.values()].sort((x, y) => y.order - x.order || x.name.localeCompare(y.name));
}

function renderRoster(d) {
  const list = $('#roster-list');
  const totalEntries = d.stats.entries || 0;
  const isAllActive = state.agentFilters.size === 0;

  const allItem = h('button', {
    class: `agent-item-btn ${isAllActive ? 'active' : ''}`,
    'aria-pressed': String(isAllActive),
    onclick: () => {
      state.agentFilters.clear();
      renderWithFeedTransition();
    },
  },
    h('div', { style: 'display:flex;align-items:center;gap:0.45rem;min-width:0;' },
      h('div', { class: 'agent-icon-badge', style: '--p-color:var(--text-secondary);' },
        svgIcon('#icon-layers', 12, 12)
      ),
      h('span', { class: 'agent-name-text' }, 'All')
    ),
    h('span', { class: 'nav-count-pill' }, String(totalEntries))
  );

  const union = getAllAgentsUnion(d);
  if (union.length === 0) {
    setChildren(list, h('div', { class: 'nav-empty-state' }, 'No agents yet'));
    return;
  }

  // Accurate per-scope counts come from the server's agent aggregate
  // (index.agentSummaries — a SQL COUNT over ALL rows), NOT the capped feed:
  // the feed only carries the most recent 200 entries, so a workspace outside
  // that window would otherwise show real entries but zero per-agent counts.
  const scopeCounts = new Map();
  for (const a of (d.agents || [])) {
    scopeCounts.set(agentKey(a.name), a.count || 0);
  }

  const agentItems = union.map((a) => {
    const meta = getProviderMeta(a.name, a.provider);
    const isActive = state.agentFilters.has(a.key);
    const count = scopeCounts.get(a.key) || 0;
    return h('button', {
      class: `agent-item-btn ${isActive ? 'active' : ''}`,
      'aria-pressed': String(isActive),
      onclick: () => {
        if (state.agentFilters.has(a.key)) state.agentFilters.delete(a.key);
        else state.agentFilters.add(a.key);
        renderWithFeedTransition();
      },
    },
      h('div', { style: 'display:flex;align-items:center;gap:0.45rem;min-width:0;' },
        h('div', { class: 'agent-icon-badge', style: `--p-color:${meta.color};` },
          svgIcon(meta.icon, 13, 13)
        ),
        h('div', { style: 'min-width:0;' },
          h('div', { class: 'agent-name-text' }, getAgentDisplayName(a.name, a.display, meta))
        )
      ),
      h('span', { class: 'nav-count-pill' }, String(count))
    );
  });

  setChildren(list, allItem, ...agentItems);
}

function renderProjectNav(d) {
  const list = $('#project-nav-list');
  if (!d.projects || d.projects.length === 0) {
    setChildren(list, h('div', { class: 'nav-empty-state' }, 'No workspaces yet'));
    return;
  }
  const visible = d.projects.filter((p) => !p.hidden);
  const hiddenProjects = d.projects.filter((p) => p.hidden);
  // "All" shows the total across every visible workspace (stable), not the
  // current scope's count — otherwise it changed every time you switched.
  const totalAcrossWorkspaces = visible.reduce((n, p) => n + (p.count || 0), 0);
  // Keep the left nav in a fixed alphabetical order — the server orders by most
  // recent activity, which makes workspaces jump around as you work.
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
  const items = [
    { id: 'all', name: 'All', count: totalAcrossWorkspaces },
    ...[...visible].sort(byName),
    ...(state.showHidden ? [...hiddenProjects].sort(byName) : []),
  ];

  const rows = items.map((p) => {
    const isActive = (state.scope === p.id) || (p.id === 'all' && state.scope === 'all');
    // Every workspace's path is a hover away, but only over the icon + name —
    // a title on the whole row would pop tooltips while merely scanning the list.
    const pathTitle = p.path || undefined;
    const btn = h('button', {
      class: `nav-item-btn ${isActive ? 'active' : ''}`,
      onclick: () => {
        state.scope = p.id;
        fetchState({ transition: true });
      },
    },
      h('div', { class: 'nav-item-left' },
        h('span', {
          class: 'nav-item-icon-wrap',
          title: pathTitle,
          style: p.color ? `color: var(--ws-${p.color});` : undefined,
        }, svgIcon('#icon-folder', 13, 13)),
        h('span', { class: 'nav-item-label', title: pathTitle }, p.name),
        p.hint ? h('span', { class: 'nav-item-hint', title: pathTitle }, p.hint) : null
      ),
      h('span', { class: 'nav-count-pill' }, String(p.count || 0))
    );
    if (p.id === 'all') return h('div', { class: 'nav-item-row' }, btn);
    const menu = h('button', {
      class: 'nav-item-menu',
      title: 'Workspace options',
      'aria-label': `Options for ${p.name}`,
      onclick: (e) => { e.stopPropagation(); openWorkspacePopover(p, e.currentTarget); },
    }, '⋯');
    return h('div', { class: `nav-item-row${p.hidden ? ' is-hidden-ws' : ''}` }, btn, menu);
  });

  // Hidden workspaces live behind a quiet toggle at the bottom of the section —
  // that's also the way back: expand, open a hidden row's ⋯, Unhide.
  if (hiddenProjects.length > 0) {
    rows.push(h('button', {
      class: `nav-hidden-toggle${state.showHidden ? ' open' : ''}`,
      onclick: () => { state.showHidden = !state.showHidden; renderProjectNav(state.data); },
    },
      h('span', { class: 'nav-hidden-caret' }, svgIcon('#icon-chevron', 11, 11)),
      h('span', {}, `Hidden (${hiddenProjects.length})`)
    ));
    if (state.showHidden) {
      // Move the toggle above the hidden rows it reveals.
      const toggle = rows.pop();
      const visibleCount = 1 + visible.length; // "All" + visible workspaces
      rows.splice(visibleCount, 0, toggle);
    }
  }

  setChildren(list, rows);
}

function renderFeed(d, { animateStats = false } = {}) {
  let entries = d.entries || [];
  // Hidden workspaces stay out of the combined view; scoping to one directly
  // (via search or an old link) still shows it — hiding is decluttering, not
  // deletion.
  if (d.scope === 'all' && state.hiddenWorkspaceIds && state.hiddenWorkspaceIds.size > 0) {
    entries = entries.filter((e) => !state.hiddenWorkspaceIds.has(e.workspaceId));
  }

  const totalHandoffs = entries.filter((e) => e.kind === 'handoff').length;
  const totalSessions = entries.filter((e) => e.kind === 'session').length;
  const totalNotes = entries.filter((e) => e.kind === 'note').length;
  setCount('#badge-all', entries.length, animateStats);
  setCount('#badge-handoff', totalHandoffs, animateStats);
  setCount('#badge-session', totalSessions, animateStats);
  setCount('#badge-note', totalNotes, animateStats);

  if (state.kindFilter === 'handoff') entries = entries.filter((e) => e.kind === 'handoff');
  else if (state.kindFilter === 'session') entries = entries.filter((e) => e.kind === 'session');
  else if (state.kindFilter === 'note') entries = entries.filter((e) => e.kind === 'note');

  if (state.agentFilters.size > 0) {
    entries = entries.filter((e) => state.agentFilters.has(agentKey(e.agent?.name)));
  }

  const stream = $('#feed-stream');
  if (entries.length === 0) {
    const reasons = [];
    if (state.query) reasons.push(`search “${state.query}”`);
    if (state.agentFilters.size > 0) reasons.push(`${state.agentFilters.size} selected agent${state.agentFilters.size === 1 ? '' : 's'}`);
    if (state.kindFilter !== 'all') reasons.push(ENTRY_KIND_METADATA[state.kindFilter]?.label.toLowerCase() || state.kindFilter);
    if (reasons.length === 0 && (!d.projects || d.projects.length === 0)) {
      setChildren(stream,
        h('div', { class: 'empty-block' },
          h('p', { style: 'margin:0;color:var(--text-primary);font-weight:500;' }, 'No workspaces yet'),
          h('p', { style: 'margin:0.45rem 0 0;font-size:0.82rem;' },
            'Run ', h('code', {}, 'ultrateam init'), ' inside a project to create one.'
          )
        )
      );
      return;
    }
    const message = reasons.length > 0
      ? `No entries match ${reasons.join(' and ')} in this workspace.`
      : 'No entries in this workspace yet.';
    setChildren(stream,
      h('div', { class: 'empty-block' },
        h('p', { style: 'margin:0;font-size:0.85rem;' }, message),
        reasons.length > 0 ? h('button', {
          class: 'action-pill-btn',
          style: 'margin-top:0.65rem;',
          onclick: resetFilters,
        }, 'Clear filters') : null
      )
    );
    return;
  }

  if (state.feedView === 'threads') {
    setChildren(stream, renderThreadedFeed(entries, d));
  } else {
    setChildren(stream, entries.map((entry) => renderCard(entry, d)));
  }
}

// Group entries into work threads by branch (the natural line of work), newest
// thread first, entries within a thread oldest-first so the relay reads top-down.
// --- Workspace options popover (display name + folder color) -----------------

const WS_COLORS = [null, 'red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink'];
let wsPopover = null;

function closeWorkspacePopover() {
  if (!wsPopover) return;
  wsPopover.remove();
  wsPopover = null;
  document.removeEventListener('pointerdown', onWsPopoverOutside, true);
  document.removeEventListener('keydown', onWsPopoverKey, true);
}
function onWsPopoverOutside(e) {
  if (wsPopover && !wsPopover.contains(e.target)) closeWorkspacePopover();
}
function onWsPopoverKey(e) {
  if (e.key === 'Escape') closeWorkspacePopover();
}

async function saveWorkspacePrefs(p, update) {
  try {
    const res = await fetch('/api/prefs', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: p.id, ...update }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
    const proj = ((state.data && state.data.projects) || []).find((x) => x.id === p.id) || p;
    if (update.color !== undefined) proj.color = update.color;
    if (update.hidden !== undefined) proj.hidden = update.hidden === true;
    if (proj !== p) { p.color = proj.color; p.hidden = proj.hidden; }
    // Patch every cached snapshot too: workspace switches repaint instantly
    // from sessionStorage, and a stale snapshot would flip this workspace back
    // (visibly "jumping" in and out of the hidden section) on every switch
    // until its server true-up landed.
    try {
      for (let i = 0; i < sessionStorage.length; i++) {
        const key = sessionStorage.key(i);
        if (!key || !key.startsWith('ut-state-cache:')) continue;
        const snapshot = JSON.parse(sessionStorage.getItem(key));
        const target = (snapshot.projects || []).find((x) => x.id === p.id);
        if (!target) continue;
        if (update.color !== undefined) target.color = update.color;
        if (update.hidden !== undefined) target.hidden = update.hidden === true;
        sessionStorage.setItem(key, JSON.stringify(snapshot));
      }
    } catch (e) {}
    render();
    // Reconcile with the server: fetchState bumps the request sequence, which
    // also drops any in-flight response from BEFORE this change — without it, a
    // stale poll landing right after the optimistic render flips the UI back.
    void fetchState();
  } catch (err) {
    showToast('Could not save workspace options: ' + err.message);
  }
}

function openWorkspacePopover(p, anchor) {
  closeWorkspacePopover();
  const swatches = h('div', { class: 'ws-swatches' }, WS_COLORS.map((c) =>
    h('button', {
      class: `ws-swatch${c ? '' : ' none'}${(p.color ?? null) === c ? ' selected' : ''}`,
      style: c ? `--swatch: var(--ws-${c});` : undefined,
      title: c ?? 'No color',
      'data-color': c ?? '',
      onclick: (e) => {
        void saveWorkspacePrefs(p, { color: c });
        for (const el of e.currentTarget.parentElement.children) {
          el.classList.toggle('selected', el.dataset.color === (c ?? ''));
        }
      },
    })
  ));
  const hideBtn = h('button', {
    class: 'ws-popover-action',
    onclick: () => {
      const hiding = !p.hidden;
      void saveWorkspacePrefs(p, { hidden: hiding ? true : null });
      if (hiding && state.scope === p.id) {
        state.scope = 'all';
        fetchState({ transition: true });
      }
      closeWorkspacePopover();
    },
  }, p.hidden ? 'Unhide workspace' : 'Hide workspace');
  wsPopover = h('div', { class: 'ws-popover', role: 'dialog', 'aria-label': `Options for ${p.name}` },
    h('div', { class: 'ws-popover-label' }, 'Folder color'),
    swatches,
    h('div', { class: 'ws-popover-divider' }),
    hideBtn
  );
  document.body.appendChild(wsPopover);
  const r = anchor.getBoundingClientRect();
  const width = 220;
  const left = Math.max(8, Math.min(r.left, window.innerWidth - width - 8));
  wsPopover.style.left = `${left}px`;
  const height = wsPopover.offsetHeight;
  wsPopover.style.top = r.bottom + 6 + height > window.innerHeight
    ? `${Math.max(8, r.top - height - 6)}px`
    : `${r.bottom + 6}px`;
  document.addEventListener('pointerdown', onWsPopoverOutside, true);
  document.addEventListener('keydown', onWsPopoverKey, true);
}

// Map workspace roots to their folder color, for the feed chips and thread heads.
function buildWorkspaceColorIndex(d) {
  const byPath = new Map();
  for (const p of (d.projects || [])) {
    if (!p.color) continue;
    const roots = (p.roots && p.roots.length) ? p.roots : [p.path];
    for (const r of roots) if (r) byPath.set(r, p.color);
  }
  return byPath;
}

// Workspace id is the join the index actually guarantees — entries can carry a
// checkout path that is no longer in the workspace's current roots (moved,
// re-cased, or deleted checkouts), so path equality is only the fallback
// for cached snapshots that predate entry.workspaceId.
function workspaceColorFor(workspaceId, projectPath) {
  const byId = state.workspaceColorById;
  return (workspaceId && byId && byId.get(workspaceId))
    || (state.workspaceColorByPath && state.workspaceColorByPath.get(projectPath))
    || null;
}
function workspaceLabelFor(workspaceId, projectPath) {
  const byId = state.workspaceLabelById;
  return (workspaceId && byId && byId.get(workspaceId))
    || (state.workspaceLabelByPath && state.workspaceLabelByPath.get(projectPath))
    || null;
}

// Two workspaces can share a folder name (~/a/demo and ~/b/demo). When names
// collide, give each colliding project a `hint`: the shortest trailing slice of
// its parent path that tells them apart. Unique names get no hint.
function annotateProjectNames(projects) {
  const groups = new Map();
  for (const p of (projects || [])) {
    p.hint = '';
    const group = groups.get(p.name) ?? [];
    group.push(p);
    groups.set(p.name, group);
  }
  for (const group of groups.values()) {
    if (group.length < 2) continue;
    // The display name is not always the folder basename, so slice the full
    // path; a hint that just re-states the name gets that suffix stripped.
    const paths = group.map((p) => (p.path || '').split(/[\\/]/).filter(Boolean));
    const maxDepth = Math.max(...paths.map((segs) => segs.length), 1);
    for (let depth = 1; depth <= maxDepth; depth++) {
      const hints = paths.map((segs) => segs.slice(-depth).join('/'));
      if (new Set(hints).size !== group.length) continue; // still colliding — go deeper
      group.forEach((p, i) => {
        let hint = hints[i];
        if (hint === p.name) hint = '';
        else if (hint.endsWith('/' + p.name)) hint = hint.slice(0, -(p.name.length + 1));
        p.hint = hint;
      });
      break;
    }
    // Identical full paths (legacy data): nothing path-based can tell them apart.
  }
}

function projectLabel(p) {
  return p.hint ? `${p.name} · ${p.hint}` : p.name;
}

// Map every known workspace root to its display name, so a thread can name the
// workspace it belongs to even in the combined "All" view.
function buildWorkspaceNameIndex(d) {
  const byPath = new Map();
  for (const p of (d.projects || [])) {
    const roots = (p.roots && p.roots.length) ? p.roots : [p.path];
    for (const r of roots) if (r) byPath.set(r, projectLabel(p));
  }
  return byPath;
}

// A thread is one branch of work inside one workspace. Keying by workspace+branch
// keeps a "main" in project A distinct from a "main" in project B. A workspace
// with no git repo has no branch — those entries thread by workspace alone.
function threadKey(projectPath, branch) {
  return `${projectPath || ''}::${branch || ''}`;
}

function renderThreadedFeed(entries, d) {
  const names = buildWorkspaceNameIndex(d);
  const groups = new Map();
  for (const e of entries) {
    // Keep a genuine null branch (non-git workspace) null — don't fabricate "main".
    const branch = (e.branch && String(e.branch).trim()) ? String(e.branch).trim() : null;
    const key = threadKey(e.projectPath, branch);
    // Prefer the display-name maps: they carry custom names and collision hints;
    // the entry's recorded project field is the fallback.
    if (!groups.has(key)) {
      groups.set(key, {
        branch,
        projectPath: e.projectPath,
        workspaceId: e.workspaceId,
        workspace: workspaceLabelFor(e.workspaceId, e.projectPath) || e.project || '',
        entries: [],
      });
    }
    groups.get(key).entries.push(e);
  }
  const groupArr = [...groups.entries()].map(([key, g]) => {
    const sorted = [...g.entries].sort((a, b) => (a.ts || '').localeCompare(b.ts || ''));
    const lastTs = g.entries.reduce((m, e) => ((e.ts || '') > m ? (e.ts || '') : m), '');
    const seen = new Set();
    const relay = [];
    for (const e of sorted) {
      const nm = e.agent && e.agent.name;
      // Carry the entry's resolved pretty display (entry.meta.display) into the relay.
      if (nm && !seen.has(agentKey(nm))) {
        seen.add(agentKey(nm));
        relay.push({ name: nm, provider: e.agent && e.agent.provider, display: e.meta && e.meta.display });
      }
    }
    const workspace = g.workspace || names.get(g.projectPath) || '';
    return { key, branch: g.branch, projectPath: g.projectPath, workspaceId: g.workspaceId, workspace, entries: sorted, lastTs, relay };
  }).sort((a, b) => b.lastTs.localeCompare(a.lastTs));

  // Remember the current thread keys so "expand/collapse all" can act on them.
  state.lastThreadKeys = groupArr.map((g) => g.key);
  const collapsedCount = state.collapsedThreads ? groupArr.filter((g) => state.collapsedThreads.has(g.key)).length : 0;
  const allCollapsed = groupArr.length > 0 && collapsedCount >= groupArr.length;

  const toolbar = groupArr.length > 1 ? h('div', { class: 'thread-toolbar' },
    h('span', { class: 'thread-toolbar-count' }, `${groupArr.length} threads`),
    h('button', { class: `thread-toolbar-btn ${allCollapsed ? 'is-collapsed' : ''}`, type: 'button', onclick: () => setAllThreads(allCollapsed ? 'expand' : 'collapse') },
      h('span', { class: 'thread-toolbar-caret' }, svgIcon('#icon-chevron', 12, 12)),
      h('span', {}, allCollapsed ? 'Expand all' : 'Collapse all')
    )
  ) : null;

  return [toolbar, ...groupArr.map((g) => renderThreadGroup(g, d))].filter(Boolean);
}

function renderThreadGroup(g, d) {
  const collapsed = state.collapsedThreads && state.collapsedThreads.has(g.key);
  const isFresh = state.freshThreads && state.freshThreads.has(g.key);
  const relayNodes = [];
  g.relay.forEach((agent, i) => {
    const meta = getProviderMeta(agent && agent.name, agent && agent.provider);
    if (i > 0) relayNodes.push(h('span', { class: 'thread-relay-arrow' }, '→'));
    relayNodes.push(h('span', { class: 'agent-icon-badge', style: `--p-color:${meta.color};`, title: getAgentDisplayName(agent && agent.name, agent && agent.display, meta) }, svgIcon(meta.icon, 12, 12)));
  });
  const handoffs = g.entries.filter((e) => e.kind === 'handoff').length;
  const head = h('button', { class: 'thread-head', type: 'button', onclick: () => toggleThread(g.key) },
    h('span', { class: 'thread-chevron' }, svgIcon('#icon-chevron', 14, 14)),
    h('span', { class: 'thread-head-labels' },
      g.workspace ? h('span', { class: 'thread-workspace' },
        h('span', {
          class: 'ws-folder-tint',
          style: workspaceColorFor(g.workspaceId, g.projectPath)
            ? `color: var(--ws-${workspaceColorFor(g.workspaceId, g.projectPath)});`
            : undefined,
        }, svgIcon('#icon-folder', 11, 11)),
        h('span', { class: 'ws-name-tip' }, g.workspace)) : null,
      g.branch ? h('span', { class: 'thread-branch' }, svgIcon('#icon-branch', 12, 12), h('span', {}, g.branch)) : null
    ),
    h('span', { class: 'thread-relay' }, ...relayNodes),
    h('span', { class: 'thread-meta' },
      isFresh ? h('span', { class: 'thread-new-badge' }, 'New') : null,
      handoffs > 0 ? h('span', {}, `${handoffs} handoff${handoffs === 1 ? '' : 's'}`) : null,
      h('span', {}, `${g.entries.length} entr${g.entries.length === 1 ? 'y' : 'ies'}`),
      h('span', {}, timeAgo(g.lastTs))
    )
  );

  // Render the thread as an exchange with an avatar rail. Baton passes are
  // computed in chronological order (so "picked up the thread" is accurate),
  // but the messages are displayed newest-first — matching the rest of the app
  // — so the latest entry is at the top and you never scroll to find it.
  let prevKey = null;
  const rows = g.entries.map((e) => {
    const k = agentKey(e.agent && e.agent.name);
    const passed = prevKey && k && k !== prevKey;
    prevKey = k || prevKey;
    return { e, passed };
  });
  rows.reverse();
  // Keep threads glanceable: show only the latest few entries by default, with a
  // "show earlier" expander for the rest of the chain (Twitter-style).
  const THREAD_PREVIEW = 3;
  const showAll = rows.length <= THREAD_PREVIEW || (state.threadShowAll && state.threadShowAll.has(g.key));
  const visible = showAll ? rows : rows.slice(0, THREAD_PREVIEW);
  const body = visible.map(({ e, passed }, idx) => {
    const meta = getProviderMeta(e.agent && e.agent.name, e.agent && e.agent.provider);
    const name = getAgentDisplayName(e.agent && e.agent.name, e.meta && e.meta.display, meta);
    const expanded = state.threadExpanded && state.threadExpanded.has(e.id);
    // Only the true oldest (shown when fully expanded) ends the rail; while
    // collapsed, the last visible row keeps its line down to the expander.
    const isLast = showAll && idx === visible.length - 1;
    return h('div', { class: `thread-msg${passed ? ' thread-msg-pass' : ''}${isLast ? ' thread-msg-last' : ''}` },
      h('div', { class: 'thread-msg-rail' },
        h('span', { class: 'thread-msg-avatar agent-icon-badge', style: `--p-color:${meta.color};`, title: name }, svgIcon(meta.icon, 13, 13)),
        h('span', { class: 'thread-msg-line' })
      ),
      h('div', { class: 'thread-msg-content' },
        h('button', { class: 'thread-msg-author', type: 'button', onclick: () => toggleThreadEntry(e.id) },
          h('span', { class: 'thread-msg-name' }, name),
          passed ? h('span', { class: 'thread-msg-pass-tag' }, 'picked up the thread') : null,
          h('span', { class: 'thread-msg-time' }, timeAgo(e.ts)),
          h('span', { class: `thread-msg-toggle ${expanded ? 'is-open' : ''}` }, svgIcon('#icon-chevron', 12, 12))
        ),
        expanded ? renderCard(e, d) : renderThreadEntryCondensed(e, d)
      )
    );
  });
  if (rows.length > THREAD_PREVIEW) {
    const hidden = rows.length - THREAD_PREVIEW;
    body.push(h('button', { class: 'thread-more', type: 'button', onclick: () => toggleThreadShowAll(g.key) },
      h('span', { class: `thread-more-caret ${showAll ? 'is-open' : ''}` }, svgIcon('#icon-chevron', 12, 12)),
      h('span', {}, showAll ? 'Show fewer' : `Show ${hidden} earlier ${hidden === 1 ? 'entry' : 'entries'}`)
    ));
  }
  return h('div', { class: `thread-group ${collapsed ? 'collapsed' : ''}${isFresh ? ' thread-has-new' : ''}` },
    head,
    h('div', { class: 'thread-body' }, ...body)
  );
}

// A condensed entry inside a thread: kind + title + one summary line + counts.
// Clicking it (or the byline caret) swaps in the full card.
function renderThreadEntryCondensed(e, d) {
  const kind = ENTRY_KIND_METADATA[e.kind] || { icon: '#icon-file', label: e.kind };
  const counts = [];
  if (e.files && e.files.length) counts.push(`${e.files.length} file${e.files.length === 1 ? '' : 's'}`);
  if (e.decisions && e.decisions.length) counts.push(`${e.decisions.length} decision${e.decisions.length === 1 ? '' : 's'}`);
  if (e.open_threads && e.open_threads.length) counts.push(`${e.open_threads.length} open`);
  return h('button', { class: 'thread-entry', type: 'button', onclick: () => toggleThreadEntry(e.id) },
    h('span', { class: 'thread-entry-body' },
      h('span', { class: 'thread-entry-titlerow' },
        h('span', { class: 'thread-entry-title' }, e.title || '(untitled)'),
        h('span', { class: `kind-pill ${e.kind}` }, svgIcon(kind.icon, 10, 10), h('span', {}, kind.label))
      ),
      e.summary ? h('span', { class: 'thread-entry-summary' }, e.summary) : null,
      counts.length ? h('span', { class: 'thread-entry-counts' }, counts.join(' · ')) : null
    )
  );
}

function toggleThreadEntry(id) {
  if (!state.threadExpanded) state.threadExpanded = new Set();
  if (state.threadExpanded.has(id)) state.threadExpanded.delete(id);
  else state.threadExpanded.add(id);
  render();
}

function toggleThreadShowAll(key) {
  if (!state.threadShowAll) state.threadShowAll = new Set();
  if (state.threadShowAll.has(key)) state.threadShowAll.delete(key);
  else state.threadShowAll.add(key);
  render();
}

function toggleThread(key) {
  if (!state.collapsedThreads) state.collapsedThreads = new Set();
  if (state.collapsedThreads.has(key)) state.collapsedThreads.delete(key);
  else state.collapsedThreads.add(key);
  render();
}

function setAllThreads(mode) {
  if (!state.collapsedThreads) state.collapsedThreads = new Set();
  const keys = state.lastThreadKeys || [];
  if (mode === 'collapse') keys.forEach((k) => state.collapsedThreads.add(k));
  else keys.forEach((k) => state.collapsedThreads.delete(k));
  render();
}

// Flag the threads that just received an entry so the head can show a brief
// "New" marker, then auto-dismiss after a few seconds (app-standard behavior).
function markFreshThreads(arrivals) {
  if (!arrivals || !arrivals.length) return;
  if (!state.freshThreads) state.freshThreads = new Set();
  for (const e of arrivals) {
    const branch = (e.branch && String(e.branch).trim()) ? String(e.branch).trim() : 'main';
    state.freshThreads.add(threadKey(e.projectPath, branch));
  }
  if (state.freshThreadsTimer) clearTimeout(state.freshThreadsTimer);
  state.freshThreadsTimer = setTimeout(() => {
    if (state.freshThreads) state.freshThreads.clear();
    if (state.feedView === 'threads') render();
  }, 4200);
}

function renderCard(entry, d) {
  const providerMeta = getProviderMeta(entry.agent?.name || entry.meta?.display, entry.agent?.provider || entry.meta?.provider);
  const kindMeta = ENTRY_KIND_METADATA[entry.kind] || { icon: '#icon-file', label: entry.kind };
  const activePanel = state.expandedPanels.get(entry.id) || null;
  const isSelected = state.selectedEntryId === entry.id;

  const card = h('article', {
    class: `notion-card ${isSelected ? 'selected' : ''} ${state.newEntryIds.has(entry.id) ? 'entry-new' : ''}`,
    'data-id': entry.id,
  },
    // Header Line
    h('div', { class: 'card-header-line' },
      h('div', { class: 'card-meta-left' },
        h('div', { class: 'agent-badge-pill' },
          h('div', { class: 'agent-icon-badge', style: `--p-color:${providerMeta.color};` },
            svgIcon(providerMeta.icon, 13, 13)
          ),
          h('span', { class: 'agent-identity-copy' },
            h('span', {}, getAgentDisplayName(entry.agent?.name, entry.meta?.display, providerMeta)),
            entry.agent?.model ? h('span', { class: 'agent-model-inline', title: entry.agent.model }, entry.agent.model) : null
          )
        ),
        h('span', { class: `kind-pill ${entry.kind}` },
          svgIcon(kindMeta.icon, 10, 10),
          h('span', {}, kindMeta.label)
        )
      ),
      h('span', { class: 'card-time', title: fullDateTime(entry.ts) }, timeAgo(entry.ts))
    ),

    // Title & Summary
    h('h3', { class: 'card-title' },
      h('button', {
        class: 'card-title-btn',
        onclick: () => toggleCardPanel(entry.id, 'details'),
      }, entry.title)
    ),
    h('p', { class: 'card-summary' }, entry.summary),
    (entry.branch || entry.origin || (d.scope === 'all' && entry.project)) ? h('div', { class: 'card-context-row' },
      entry.branch ? h('span', { class: 'card-context-item' },
        svgIcon('#icon-branch', 10, 10),
        h('span', {}, entry.branch)
      ) : null,
      // Quiet provenance marker: this entry was written from a throwaway
      // checkout (worktree/clone); the tooltip carries the checkout details.
      entry.origin ? h('span', {
        class: 'card-context-item ws-origin-mark',
        title: `written from ${entry.origin.kind} ${entry.origin.name} · ${entry.origin.path}`,
      }, svgIcon('#icon-worktree', 10, 10)) : null,
      d.scope === 'all' && entry.project ? h('span', { class: 'card-context-item' },
        h('span', {
          class: 'ws-folder-tint',
          style: workspaceColorFor(entry.workspaceId, entry.projectPath)
            ? `color: var(--ws-${workspaceColorFor(entry.workspaceId, entry.projectPath)});`
            : undefined,
        }, svgIcon('#icon-folder', 10, 10)),
        h('span', { class: 'ws-name-tip' }, workspaceLabelFor(entry.workspaceId, entry.projectPath) || entry.project)
      ) : null
    ) : null,

    // Stable action selector: every option opens an inline text panel.
    h('div', { class: 'card-action-bar' },
      h('div', { class: 'action-cluster' },
        h('button', {
          class: `action-pill-btn ${activePanel === 'details' ? 'active' : ''}`,
          'aria-expanded': String(activePanel === 'details'),
          onclick: () => toggleCardPanel(entry.id, 'details'),
        }, 'Details'),
        h('button', {
          class: `action-pill-btn ${activePanel === 'commands' ? 'active' : ''}`,
          'aria-expanded': String(activePanel === 'commands'),
          onclick: () => toggleCardPanel(entry.id, 'commands'),
        }, 'Commands'),
        h('button', {
          class: `action-pill-btn ${activePanel === 'json' ? 'active' : ''}`,
          'aria-expanded': String(activePanel === 'json'),
          onclick: () => toggleCardPanel(entry.id, 'json'),
        }, 'JSON')
      ),
      h('span', { class: 'id-label' }, entry.id.slice(0, 10) + '…')
    ),
    activePanel ? renderCardPanel(entry, activePanel) : null
  );

  return card;
}

function renderResumeCapsule(resume) {
  const list = (label, items) => items && items.length ? h('div', {},
    h('span', { class: 'resume-label' }, label),
    h('ul', { class: 'resume-list' }, items.map((item) => h('li', {}, item)))
  ) : null;
  const gitFacts = resume.git ? [
    `Branch: ${resume.git.branch || 'detached/unknown'}`,
    `HEAD: ${resume.git.head ? resume.git.head.slice(0, 12) : 'unknown'}`,
    `Working tree: ${resume.git.dirty ? 'dirty' : 'clean'}`,
    ...(resume.git.changed_files || []).map((file) => `Changed: ${file}`),
  ] : [];
  return h('section', { class: 'resume-capsule' },
    h('div', { class: 'resume-objective' },
      h('span', { class: 'resume-label' }, 'Resume objective'),
      resume.objective
    ),
    h('div', { class: 'resume-grid' },
      list('Completed', resume.completed),
      list('Next steps', resume.next_steps),
      list('Blockers', resume.blockers),
      list('Verification', resume.verification),
      list('Useful commands', resume.commands),
      list('Captured Git state', gitFacts)
    )
  );
}

function renderCardPanel(entry, panel) {
  const detailsText = formatEntryText(entry);
  const jsonText = JSON.stringify(entry, null, 2);
  const isCommands = panel === 'commands';
  const config = panel === 'json'
    ? { title: 'Entry JSON', text: jsonText, copyLabel: 'Copy JSON' }
    : panel === 'details'
      ? { title: 'Entry details', text: detailsText, copyLabel: 'Copy details' }
      : { title: 'Commands', text: '', copyLabel: '' };

  // The copy button lives in the header row, to the right of the label (or in
  // each command's header). The content below is just the plain text box(es).
  const content = panel === 'json'
    ? codeBox(jsonText)
    : isCommands
      ? renderCommands(entry)
      : h('div', { class: 'panel-body' }, renderEntryDetails(entry));

  return h('section', { class: 'card-inline-panel', 'data-panel': panel },
    h('div', { class: 'inline-panel-header' },
      h('h4', { class: 'inline-panel-title' }, config.title),
      h('div', { class: 'inline-panel-actions' },
        (panel === 'json' || panel === 'details')
          ? headerCopyBtn(config.text, config.copyLabel)
          : null,
        h('button', {
          class: 'action-pill-btn panel-icon-btn',
          title: `Collapse ${config.title.toLowerCase()}`,
          'aria-label': `Collapse ${config.title.toLowerCase()}`,
          onclick: () => toggleCardPanel(entry.id, panel),
        }, h('span', { class: 'collapse-icon' }, svgIcon('#icon-chevron', 14, 14)))
      )
    ),
    content
  );
}

// A plain, read-only text box.
function codeBox(text) {
  return h('pre', { class: 'code-container' }, text);
}

// A small copy button for a panel or command header row, sitting to the right
// of the label.
function headerCopyBtn(text, label) {
  return h('button', {
    class: 'action-pill-btn panel-icon-btn',
    title: label,
    'aria-label': label,
    onclick: () => copyText(text, `${label.replace('Copy ', '')} copied`),
  }, svgIcon('#icon-copy', 12, 12));
}

function renderCommands(entry) {
  const commands = [
    { label: 'Show entry', value: `ultrateam show ${entry.id}` },
    ...(entry.resume || entry.kind === 'handoff'
      ? [{ label: 'Resume work', value: `ultrateam resume --id ${entry.id}` }]
      : []),
  ];
  return h('div', { class: 'command-list' }, commands.map((command) =>
    h('div', { class: 'command-item' },
      h('div', { class: 'command-item-header' },
        h('span', { class: 'command-item-label' }, command.label),
        headerCopyBtn(command.value, `Copy ${command.label.toLowerCase()} command`)
      ),
      codeBox(command.value)
    )
  ));
}

function renderEntryDetails(entry) {
  return h('div', { class: 'toggle-block' },
    entry.resume ? renderResumeCapsule(entry.resume) : null,
    entry.open_threads && entry.open_threads.length > 0 ? h('div', {},
      h('div', { style: 'font-weight:600;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.25rem;' }, 'Open Items Recorded'),
      h('ul', { class: 'bullet-list' }, entry.open_threads.map((item) =>
        h('li', { class: 'bullet-item' }, h('span', { class: 'bullet-dot' }, '•'), h('span', {}, item))
      ))
    ) : null,
    entry.decisions && entry.decisions.length > 0 ? h('div', {},
      h('div', { style: 'font-weight:600;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.25rem;' }, 'Decisions & Rationale'),
      h('ul', { class: 'bullet-list' }, entry.decisions.map((dec) =>
        h('li', { class: 'bullet-item' }, h('span', { class: 'bullet-dot' }, '•'), h('span', {}, dec))
      ))
    ) : null,
    entry.files && entry.files.length > 0 ? h('div', {},
      h('div', { style: 'font-weight:600;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.25rem;' }, `Files Touched (${entry.files.length})`),
      h('div', { class: 'files-grid' }, entry.files.map((file) =>
        h('span', { class: 'file-badge-btn' }, svgIcon('#icon-file', 10, 10), h('span', {}, file))
      ))
    ) : null,
    entry.tags && entry.tags.length > 0 ? h('div', { class: 'tags-row' },
      entry.tags.map((tag) => h('span', { class: 'notion-tag' }, `#${tag}`))
    ) : null
  );
}

function formatEntryText(entry) {
  const lines = [entry.title, '', entry.summary];
  const add = (label, items) => {
    if (!items || items.length === 0) return;
    lines.push('', `${label}:`, ...items.map((item) => `- ${item}`));
  };
  add('Decisions', entry.decisions);
  add('Files', entry.files);
  add('Open threads recorded at handoff', entry.open_threads);
  add('Tags', entry.tags);
  if (entry.origin) lines.push('', `Written from ${entry.origin.kind}: ${entry.origin.name} (${entry.origin.path})`);
  return lines.join('\n');
}

function toggleCardPanel(id, panel = 'details') {
  if (state.expandedPanels.get(id) === panel) {
    const card = $(`.notion-card[data-id="${id}"]`);
    const openPanel = card?.querySelector('.card-inline-panel');
    if (openPanel && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      openPanel.classList.add('panel-closing');
      openPanel.addEventListener('animationend', () => {
        state.expandedPanels.delete(id);
        render();
      }, { once: true });
      return;
    }
    state.expandedPanels.delete(id);
  } else {
    state.expandedPanels.set(id, panel);
  }
  render();
}

function resetFilters() {
  state.query = '';
  state.agentFilters.clear();
  state.kindFilter = 'all';
  $('#search-input').value = '';
  $('#search-clear').style.display = 'none';
  $$('.view-tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.kind === 'all'));
  fetchState({ transition: true });
}

let toastTimer = null;
function showToast(msg) {
  const toast = $('#toast-hud');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

function copyText(text, msg = 'Copied to clipboard') {
  navigator.clipboard.writeText(text).then(() => {
    showToast(msg);
  }).catch(() => {
    const t = document.createElement('textarea');
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
    showToast(msg);
  });
}

function renderError(msg) {
  setChildren($('#feed-stream'),
    h('div', { class: 'empty-block' },
      h('p', {}, `Unable to reach ultrateam viewer server: ${msg}`),
      h('button', { class: 'action-pill-btn', style: 'margin-top:0.5rem;', onclick: fetchState }, 'Retry')
    )
  );
}

let searchTimer = null;
const searchInput = $('#search-input');
const searchClear = $('#search-clear');
if (initialQuery) {
  searchInput.value = initialQuery;
  searchClear.style.display = 'block';
}

searchInput.addEventListener('input', (ev) => {
  const val = ev.target.value.trim();
  searchClear.style.display = val ? 'block' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = val;
    fetchState({ transition: true });
  }, 220);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  state.query = '';
  fetchState({ transition: true });
  searchInput.focus();
});

$$('.view-tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    $$('.view-tab-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    state.kindFilter = btn.dataset.kind;
    renderWithFeedTransition();
  });
});

// Timeline / Threads toggle
$$('.feed-view-btn').forEach((btn) => {
  btn.classList.toggle('active', btn.dataset.view === state.feedView);
  btn.addEventListener('click', () => {
    if (state.feedView === btn.dataset.view) return;
    $$('.feed-view-btn').forEach((b) => b.classList.toggle('active', b === btn));
    state.feedView = btn.dataset.view;
    try { localStorage.setItem('ut-feed-view', state.feedView); } catch {}
    renderWithFeedTransition();
  });
});

function toggleTheme() {
  document.documentElement.classList.add('disable-transitions');
  const cur = document.documentElement.dataset.theme;
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('ut-theme', next); } catch {}
  updateThemeIcon();

  // Force reflow and restore hover transitions cleanly in the next frame
  window.getComputedStyle(document.documentElement).opacity;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.documentElement.classList.remove('disable-transitions');
    });
  });
}

function updateThemeIcon() {
  const isLight = document.documentElement.dataset.theme === 'light' ||
    (!document.documentElement.dataset.theme && !matchMedia('(prefers-color-scheme: dark)').matches);
  const iconUse = $('#theme-icon use');
  if (iconUse) {
    iconUse.setAttribute('href', isLight ? '#icon-moon' : '#icon-sun');
  }
  const btn = $('#theme-btn');
  if (btn) {
    btn.title = isLight ? 'Switch to dark mode' : 'Switch to light mode';
    btn.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
  }
}

const filterSidebar = $('#filter-sidebar');
const workspaceShell = $('#workspace-shell');
const sidebarToggle = $('#sidebar-toggle');
const sidebarShelf = $('#sidebar-shelf');
const sidebarBackdrop = $('#sidebar-backdrop');
const mobileSidebarQuery = matchMedia('(max-width: 820px)');

function updateSidebarToggle() {
  const isMobile = mobileSidebarQuery.matches;
  const isVisible = isMobile
    ? document.body.classList.contains('sidebar-open')
    : !workspaceShell.classList.contains('sidebar-shelved') && !document.documentElement.classList.contains('sidebar-shelved');
  const label = isMobile
    ? (isVisible ? 'Close navigation' : 'Open navigation')
    : (isVisible ? 'Hide sidebar' : 'Show sidebar');
  sidebarToggle.setAttribute('aria-expanded', String(isVisible));
  sidebarToggle.setAttribute('aria-label', label);
  sidebarToggle.title = label;
  const shelfLabel = isMobile ? 'Close navigation' : 'Hide sidebar';
  sidebarShelf.setAttribute('aria-label', shelfLabel);
  sidebarShelf.title = shelfLabel;
}

function setMobileSidebarOpen(open) {
  document.body.classList.toggle('sidebar-open', open);
  updateSidebarToggle();
}

function setSidebarShelved(shelved) {
  document.documentElement.classList.toggle('sidebar-shelved', shelved);
  document.body.classList.toggle('sidebar-shelved', shelved);
  workspaceShell.classList.toggle('sidebar-shelved', shelved);
  try { localStorage.setItem('ut-sidebar-shelved', String(shelved)); } catch {}
  updateSidebarToggle();
}

sidebarToggle.addEventListener('click', () => {
  if (mobileSidebarQuery.matches) {
    setMobileSidebarOpen(!document.body.classList.contains('sidebar-open'));
  } else {
    setSidebarShelved(false);
  }
});

sidebarShelf.addEventListener('click', () => {
  if (mobileSidebarQuery.matches) {
    setMobileSidebarOpen(false);
    sidebarToggle.focus();
  } else {
    setSidebarShelved(true);
    sidebarToggle.focus();
  }
});

sidebarBackdrop.addEventListener('click', () => setMobileSidebarOpen(false));

filterSidebar.addEventListener('click', (ev) => {
  if (ev.target.closest('.agent-item-btn, .nav-item-btn') && mobileSidebarQuery.matches) {
    setMobileSidebarOpen(false);
  }
});

mobileSidebarQuery.addEventListener('change', () => {
  setMobileSidebarOpen(false);
  updateSidebarToggle();
});

$('#theme-btn').addEventListener('click', toggleTheme);

// ---- Contributions drawer wiring ----
$('#usage-btn').addEventListener('click', openUsage);
$('#usage-close').addEventListener('click', closeUsage);
$('#usage-backdrop').addEventListener('click', closeUsage);
$('#usage-refresh').addEventListener('click', loadStats);
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && !$('#usage-drawer').hidden) { ev.preventDefault(); closeUsage(); }
});

try {
  const savedTheme = localStorage.getItem('ut-theme');
  if (savedTheme === 'dark' || savedTheme === 'light') {
    document.documentElement.dataset.theme = savedTheme;
  }
  if (localStorage.getItem('ut-sidebar-shelved') === 'true') {
    document.documentElement.classList.add('sidebar-shelved');
    document.body.classList.add('sidebar-shelved');
    workspaceShell.classList.add('sidebar-shelved');
  }
  updateThemeIcon();
  updateSidebarToggle();
} catch {}

// ---- Sidebar resize ----
const SIDEBAR_MIN = 200, SIDEBAR_MAX = 480, SIDEBAR_DEFAULT = 260;
const sidebarResizer = $('#sidebar-resizer');

function getSidebarWidth() {
  const v = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'), 10);
  return isNaN(v) ? SIDEBAR_DEFAULT : v;
}
function setSidebarWidth(px, persist) {
  const w = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, Math.round(px)));
  document.documentElement.style.setProperty('--sidebar-width', w + 'px');
  if (sidebarResizer) sidebarResizer.setAttribute('aria-valuenow', String(w));
  if (persist) { try { localStorage.setItem('ut-sidebar-width', String(w)); } catch {} }
  return w;
}

if (sidebarResizer) {
  sidebarResizer.setAttribute('aria-valuemin', String(SIDEBAR_MIN));
  sidebarResizer.setAttribute('aria-valuemax', String(SIDEBAR_MAX));
  sidebarResizer.setAttribute('aria-valuenow', String(getSidebarWidth()));

  let dragging = false;
  const onMove = (e) => {
    if (!dragging) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    setSidebarWidth(x, false);
    e.preventDefault();
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    document.documentElement.classList.remove('sidebar-resizing');
    setSidebarWidth(getSidebarWidth(), true);
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('touchend', onUp);
  };
  const onDown = (e) => {
    dragging = true;
    document.documentElement.classList.add('sidebar-resizing');
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
    e.preventDefault();
  };
  sidebarResizer.addEventListener('mousedown', onDown);
  sidebarResizer.addEventListener('touchstart', onDown, { passive: false });
  sidebarResizer.addEventListener('dblclick', () => setSidebarWidth(SIDEBAR_DEFAULT, true));
  sidebarResizer.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { setSidebarWidth(getSidebarWidth() - 16, true); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { setSidebarWidth(getSidebarWidth() + 16, true); e.preventDefault(); }
    else if (e.key === 'Home') { setSidebarWidth(SIDEBAR_DEFAULT, true); e.preventDefault(); }
  });
}

window.addEventListener('keydown', (ev) => {
  if (document.activeElement === searchInput) {
    if (ev.key === 'Escape') {
      searchInput.blur();
      if (searchInput.value) {
        searchInput.value = '';
        state.query = '';
        fetchState();
      }
    }
    return;
  }

  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k' || ev.key === '/') {
    ev.preventDefault();
    searchInput.focus();
    searchInput.select();
    return;
  }

  if (ev.key === 'Escape') {
    if (document.body.classList.contains('sidebar-open')) {
      setMobileSidebarOpen(false);
      sidebarToggle.focus();
      return;
    }
    const selectedCard = state.selectedEntryId
      ? $(`.notion-card[data-id="${state.selectedEntryId}"]`)
      : null;
    if (selectedCard?.dataset.id && state.expandedPanels.has(selectedCard.dataset.id)) {
      state.expandedPanels.delete(selectedCard.dataset.id);
      render();
    }
    return;
  }

  if (ev.key.toLowerCase() === 't' && !ev.metaKey && !ev.ctrlKey) {
    toggleTheme();
    return;
  }

  const posts = $$('.notion-card');
  if (posts.length === 0) return;
  const currentIndex = posts.findIndex((post) => post.dataset.id === state.selectedEntryId);

  const selectCardAt = (index) => {
    const target = posts[index];
    if (!target) return;
    state.selectedEntryId = target.dataset.id;
    render();
    $(`.notion-card[data-id="${state.selectedEntryId}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  if (ev.key.toLowerCase() === 'j') {
    selectCardAt(Math.min(posts.length - 1, currentIndex + 1));
  } else if (ev.key.toLowerCase() === 'k') {
    selectCardAt(Math.max(0, currentIndex < 0 ? 0 : currentIndex - 1));
  } else if (ev.key.toLowerCase() === 'o' || ev.key === 'Enter') {
    const activeCard = currentIndex >= 0 ? posts[currentIndex] : null;
    if (activeCard) {
      const id = activeCard.dataset.id;
      toggleCardPanel(id, 'details');
    }
  }
});

// Workspace names on cards and thread heads ellipsize in tight layouts; show
// the full name on hover, but only when it's actually cut off — untruncated
// names stay tooltip-quiet. Checked lazily on hover so it tracks resizes.
document.addEventListener('mouseover', (ev) => {
  const el = ev.target && ev.target.closest ? ev.target.closest('.ws-name-tip') : null;
  if (!el) return;
  if (el.scrollWidth > el.clientWidth) el.title = el.textContent;
  else el.removeAttribute('title');
});

setInterval(() => {
  if (!document.hidden && !state.query) {
    fetchState();
  }
}, 10000);

// Instant synchronous hydration from session storage (zero refresh flicker)
try {
  const cacheKey = `ut-state-cache:${state.scope || 'all'}`;
  const cachedRaw = sessionStorage.getItem(cacheKey);
  if (cachedRaw) {
    const cachedData = JSON.parse(cachedRaw);
    if (cachedData && cachedData.stats && Array.isArray(cachedData.entries)) {
      state.data = cachedData;
      state.rawPayload = cachedRaw;
      if (!state.scope) state.scope = state.data.scope;
      render({ animateStats: false });
    }
  }
} catch (e) {}

// The search handler accepts both ⌘K and Ctrl+K; label whichever this platform uses.
if (!/Mac|iP(hone|ad|od)/.test(navigator.platform)) {
  $('#search-shortcut').textContent = 'Ctrl K';
}

fetchState();
// Warm the "All" snapshot so switching to any workspace can filter it instantly,
// even when the app launched straight into a single workspace.
if (state.scope && state.scope !== 'all') warmAllCache();
</script>
</body>
</html>
