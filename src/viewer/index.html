<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ultrateam — shared agent memory</title>
<script>
  (function() {
    try {
      var saved = localStorage.getItem('ut-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.dataset.theme = saved;
      }
    } catch (e) {}
  })();
</script>
<style>
/* ============================================================
   Instant Theme Transition Suppression (Zero Flicker)
   ============================================================ */
html.disable-transitions,
html.disable-transitions *,
html.disable-transitions *::before,
html.disable-transitions *::after {
  transition: none !important;
  animation-duration: 0s !important;
}

:root {
  color-scheme: dark;
  --font-sans: "Söhne", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Inter", sans-serif;
  --font-mono: "Söhne Mono", "SF Mono", "Geist Mono", "JetBrains Mono", "Cascadia Code", ui-monospace, monospace;

  /* Dark Theme Palette (Deeper, Modern Dark) */
  --bg: #141414;
  --bg-sidebar: #0e0e0e;
  --card: #1c1c1c;
  --card-hover: #232323;
  --surface: #222222;
  --surface-hover: #2b2b2b;
  --border: rgba(255, 255, 255, 0.08);
  --border-light: rgba(255, 255, 255, 0.14);

  --text-primary: #f0f0f0;
  --text-secondary: #a6a6a6;
  --text-tertiary: #6b6b6b;

  --accent-blue: #3b82f6;
  --accent-amber: #f59e0b;
  --accent-amber-bg: rgba(245, 158, 11, 0.08);
  --accent-amber-border: rgba(245, 158, 11, 0.22);
  --accent-green: #10a37f;
  --accent-purple: #a855f7;

  --tag-bg: #222222;
  --tag-text: #b4b4b4;

  --radius: 12px;
  --radius-sm: 8px;
  --radius-pill: 9999px;

  /* Provider Brand Colors */
  --p-anthropic: #d97757;
  --p-openai: #10a37f;
  --p-google: #4a8cf6;
  --p-github: #a855f7;
  --p-cursor: #38bdf8;
  --p-human: #0ea5e9;
  --p-other: #888888;
}

:root[data-theme="light"] {
  color-scheme: light;

  /* ChatGPT Light Theme Palette */
  --bg: #ffffff;
  --bg-sidebar: #f9f9f9;
  --card: #ffffff;
  --card-hover: #f7f7f8;
  --surface: #f4f4f4;
  --surface-hover: #ececec;
  --border: rgba(0, 0, 0, 0.08);
  --border-light: rgba(0, 0, 0, 0.14);

  --text-primary: #0d0d0d;
  --text-secondary: #676767;
  --text-tertiary: #8e8e8e;

  --accent-blue: #2563eb;
  --accent-amber: #d97706;
  --accent-amber-bg: rgba(217, 119, 6, 0.08);
  --accent-amber-border: rgba(217, 119, 6, 0.22);
  --accent-green: #10a37f;
  --accent-purple: #7e22ce;

  --tag-bg: #f4f4f4;
  --tag-text: #52525b;

  --p-anthropic: #c25e3f;
  --p-openai: #0d8c6c;
  --p-google: #2563eb;
  --p-github: #7e22ce;
  --p-cursor: #0284c7;
  --p-human: #0369a1;
  --p-other: #71717a;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #ffffff;
    --bg-sidebar: #f9f9f9;
    --card: #ffffff;
    --card-hover: #f7f7f8;
    --surface: #f4f4f4;
    --surface-hover: #ececec;
    --border: rgba(0, 0, 0, 0.08);
    --border-light: rgba(0, 0, 0, 0.14);
    --text-primary: #0d0d0d;
    --text-secondary: #676767;
    --text-tertiary: #8e8e8e;
    --accent-blue: #2563eb;
    --accent-amber: #d97706;
    --accent-amber-bg: rgba(217, 119, 6, 0.08);
    --accent-amber-border: rgba(217, 119, 6, 0.22);
    --accent-green: #10a37f;
    --accent-purple: #7e22ce;
    --tag-bg: #f4f4f4;
    --tag-text: #52525b;
    --p-anthropic: #c25e3f;
    --p-openai: #0d8c6c;
    --p-google: #2563eb;
    --p-github: #7e22ce;
    --p-cursor: #0284c7;
    --p-human: #0369a1;
    --p-other: #71717a;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  margin: 0;
  padding: 0;
  background-color: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
  line-height: 1.5;
  min-height: 100vh;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 1.5px solid var(--accent-blue);
  outline-offset: 1px;
}

/* ============================================================
   ChatGPT-Inspired Top Navigation Bar
   ============================================================ */
.nav-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  width: 100%;
  height: 50px;
  background-color: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 1.25rem;

  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.nav-left {

  align-items: center;
  gap: 0.5rem;

}

.breadcrumb-root {
  display: flex;
  align-items: center;

  padding: 0.3rem 0.55rem;

}
.breadcrumb-root:hover {
  background: var(--surface);
}

.ultrateam-logo-icon {

  height: 20px;
  flex-shrink: 0;

}

.ultrateam-logo-text {

}

.breadcrumb-icon {
  font-size: 1rem;
  line-height: 1;
}

.nav-center {
  flex: 1;
  max-width: 440px;
}

.search-container {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}
.search-icon-svg {
  position: absolute;

  height: 14px;

}
.search-box {

  height: 34px;

  border: 1px solid var(--border);
  background: var(--surface);

}
.search-box:focus {
  border-color: var(--border-light);

}

}
.search-shortcut {

  right: 0.55rem;

  font-size: 0.65rem;
  color: var(--text-secondary);

}
.search-clear-btn {
  position: absolute;
  right: 2.1rem;
  background: none;
  border: none;
  padding: 0;
  font-size: 11px;
  color: var(--text-secondary);
  cursor: pointer;
  display: none;
}
.search-clear-btn:hover {
  color: var(--text-primary);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  padding: 0 0.65rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.12s ease;
}
.nav-btn:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}
.nav-btn.icon-only {
  width: 32px;
  padding: 0;
  border-radius: var(--radius-pill);
}

/* ============================================================
   ChatGPT / Productivity 2-Column Workspace Layout
   ============================================================ */
.workspace {
  max-width: 1240px;
  margin: 0 auto;
  padding: 1.5rem 1.5rem 4rem;
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  gap: 2rem;
  align-items: start;
}

/* Sidebar */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  position: sticky;
  top: 66px;
}

.sidebar-group-title {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin: 0 0 0.45rem 0.45rem;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.45rem 0.65rem;

  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 0.84rem;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.12s ease;
}
.nav-item-btn:hover {
  background: var(--surface);
  color: var(--text-primary);
}
.nav-item-btn.active {
  background: var(--surface);
  color: var(--text-primary);
  font-weight: 550;
}

.nav-item-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}
.nav-item-icon {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  color: var(--text-secondary);
}
.nav-item-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-count-pill {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text-tertiary);
}

/* Agent Roster Item */
.agent-item-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.42rem 0.65rem;
  border-radius: var(--radius-sm);
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 0.84rem;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.12s ease;
}
.agent-item-btn:hover {
  background: var(--surface);
  color: var(--text-primary);
}
.agent-item-btn.active {
  background: var(--surface);
  color: var(--text-primary);
  font-weight: 550;
}

.agent-icon-badge {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--p-color, var(--text-primary));
  background: rgba(125, 125, 125, 0.07);
}
.agent-icon-badge svg {
  width: 13px;
  height: 13px;
}

.agent-name-text {
  font-size: 0.82rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.agent-model-text {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ============================================================
   Main Document Content
   ============================================================ */
.document-main {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  min-width: 0;
}

/* Page Header & Properties Table */
.page-header {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding-bottom: 1.15rem;
  border-bottom: 1px solid var(--border);
}

.page-title-row {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}

.page-icon {
  font-size: 1.6rem;
  line-height: 1;
}

.page-title {
  font-size: 1.65rem;
  font-weight: 650;
  letter-spacing: -0.025em;
  color: var(--text-primary);
  margin: 0;
}

.properties-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 0.5rem;
  margin-top: 0.25rem;
}

.property-chip {

  align-items: center;
  gap: 0.45rem;

  font-size: 0.78rem;
}
.property-label {
  color: var(--text-tertiary);

}
.property-value {
  color: var(--text-primary);

}

/* Database Views Toolbar */
.views-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;

  padding-bottom: 0.25rem;
}

.views-tabs {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
  width: 100%;
}

.view-tab-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.45rem 0.85rem;

  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-secondary);
  font-size: 0.83rem;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: -1px;
  transition: all 0.12s ease;
}
.view-tab-btn:hover {
  color: var(--text-primary);
}
.view-tab-btn.active {
  color: var(--text-primary);
  border-bottom-color: var(--text-primary);
  font-weight: 600;
}
.view-tab-count {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  opacity: 0.7;
}

/* Timeline Stream */
.timeline-feed {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

/* Card Block */
.notion-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.15rem 1.3rem;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  overflow-wrap: anywhere;
}
.notion-card:hover {
  background: var(--card-hover);

}
.notion-card.selected {

}

.card-header-line {

}

.agent-badge-pill {

  border: 1px solid var(--border);

}
.agent-badge-pill .agent-icon-badge {

.agent-badge-pill .agent-icon-badge svg {

}

.meta-prop-pill {

.kind-pill {

  text-transform: uppercase;

}
.kind-pill.handoff {

}
.kind-pill.session {
  background: var(--surface);

  border: 1px solid var(--border);
}
.kind-pill.note {
  background: var(--surface);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.card-time {
  font-size: 0.75rem;
  color: var(--text-tertiary);
  margin-left: auto;
}

.card-title {
  margin: 0 0 0.35rem 0;
  font-size: 0.98rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}
.card-title-btn {
  background: none;
  border: none;
  padding: 0;
  text-align: left;
  cursor: pointer;
  color: inherit;
  font: inherit;
}
.card-title-btn:hover {

}

.card-summary {
  margin: 0;
  font-size: 0.85rem;
  color: var(--text-secondary);

}

/* Notion Callout Box for Open Threads */
.notion-callout {
  background: var(--accent-amber-bg);
  border: 1px solid var(--accent-amber-border);

  display: flex;
  gap: 0.65rem;
  align-items: flex-start;

.callout-content {

/* ============================================================
   Modal & Toast
   ============================================================ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(3px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-backdrop.open {
  display: flex;
}

.modal-dialog {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 620px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
}
.modal-header {
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  font-size: 0.9rem;
  font-weight: 600;
  margin: 0;
}
.modal-close-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 2px;
}
.modal-body {
  padding: 1rem;
  overflow-y: auto;
}
.code-container {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  line-height: 1.5;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.85rem;
  margin: 0;
  white-space: pre-wrap;
  color: var(--text-primary);
}
.modal-footer {
  padding: 0.65rem 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 0.5rem;
}

.toast-box {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: var(--card);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 0.45rem 1.1rem;
  font-size: 0.78rem;
  font-weight: 500;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: all 0.18s ease;
}
.toast-box.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.empty-block {
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 3.5rem 1.5rem;
  text-align: center;
  color: var(--text-secondary);
}

@media (max-width: 820px) {
  .workspace {
    grid-template-columns: 1fr;
    padding: 1rem;
  }
  .sidebar {
    position: static;
  }
  .nav-center {
    max-width: 160px;
  }
}
</style>

  data: null,
  rawPayload: '',
  seq: 0,
};

const PROVIDER_METADATA = {
  claude:    { icon: '#icon-claude',        color: 'var(--p-anthropic)', name: 'Claude Code' },
  anthropic: { icon: '#icon-claude',        color: 'var(--p-anthropic)', name: 'Anthropic Claude' },
  openai:    { icon: '#icon-openai',        color: 'var(--p-openai)',    name: 'OpenAI' },
  google:    { icon: '#icon-google',        color: 'var(--p-google)',    name: 'Google Gemini' },
  github:    { icon: '#icon-githubcopilot', color: 'var(--p-github)',    name: 'GitHub Copilot' },
  cursor:    { icon: '#icon-cursor',        color: 'var(--p-cursor)',    name: 'Cursor' },
  human:     { icon: '#icon-human',         color: 'var(--p-human)',     name: 'Human' },
  other:     { icon: '#icon-file',          color: 'var(--p-other)',     name: 'Agent' },
};

function getProviderMeta(agentName, provider) {
  const an = (agentName || '').toLowerCase();
  const pr = (provider || '').toLowerCase();

  if (an.includes('claude') || an.includes('anthropic') || pr.includes('anthropic') || pr.includes('claude')) {
    return PROVIDER_METADATA.claude;
  }
  if (an.includes('copilot') || pr.includes('github') || pr.includes('copilot')) {
    return PROVIDER_METADATA.github;
  }
  if (an.includes('gemini') || an.includes('antigravity') || pr.includes('google')) {
    return PROVIDER_METADATA.google;
  }
  if (an.includes('cursor') || pr.includes('cursor')) {
    return PROVIDER_METADATA.cursor;
  }
  if (an.includes('codex') || an.includes('gpt') || pr.includes('openai')) {
    return PROVIDER_METADATA.openai;
  }
  if (an.includes('human') || pr.includes('human')) {
    return PROVIDER_METADATA.human;
  }
  return PROVIDER_METADATA.other;
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k.startsWith('style') && typeof v === 'string') el.style.cssText = v;
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? '' : v);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined) continue;
    el.append(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return el;
}

function svgIcon(iconId, width = 12, height = 12) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', String(width));
  svg.setAttribute('height', String(height));
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', iconId);
  svg.appendChild(use);
  return svg;
}

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

function setChildren(el, ...children) {
  el.replaceChildren(...children.flat(Infinity).filter((c) => c !== null && c !== undefined));
}

function timeAgo(iso) {
  const ms = Date.now() - Date.parse(iso);
  if (isNaN(ms) || ms < 0) return 'just now';
  const sec = Math.floor(ms / 1000);
  if (sec < 45) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  if (day === 1) return 'yesterday';
  if (day < 30) return `${day}d ago`;
  const mo = Math.floor(day / 30);
  return `${mo}mo ago`;
}

function fullDateTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  } catch {
    return iso;
  }
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

async function fetchState() {
  const currentSeq = ++state.seq;
  const params = new URLSearchParams();
  if (state.scope) params.set('project', state.scope);
  if (state.query) params.set('q', state.query);

  try {
    const res = await fetch('/api/state?' + params.toString());
    if (currentSeq !== state.seq) return;
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.text();
    if (currentSeq !== state.seq) return;
    if (raw === state.rawPayload) return;
    state.rawPayload = raw;
    state.data = JSON.parse(raw);
    if (!state.scope) state.scope = state.data.scope;
    render();
  } catch (err) {
    if (currentSeq !== state.seq) return;
    renderError(err.message);
  }
}

function render() {
  const d = state.data;
  if (!d) return;

  renderOverview(d);
  renderRoster(d);
  renderProjectNav(d);
  renderFeed(d);
  updateThemeIcon();

  const currentProjectName = d.scope === 'all'
    ? 'All Workspaces'
    : (d.projects.find((p) => p.path === d.scope)?.name || 'Workspace');
  $('#page-title-text').textContent = currentProjectName;
  document.title = `ultrateam — ${currentProjectName}`;
}

function renderOverview(d) {
  $('#stat-total').textContent = String(d.stats.entries || 0);
  $('#stat-handoffs').textContent = String(d.stats.handoffs || 0);
  $('#stat-threads').textContent = String(d.stats.openThreads || 0);
  $('#stat-agents').textContent = String(d.agents ? d.agents.length : 0);
}

function renderRoster(d) {
  const list = $('#roster-list');
  const totalEntries = d.stats.entries || 0;
  const isAllActive = state.agentFilter === null;

  const allItem = h('button', {
    class: `agent-item-btn ${isAllActive ? 'active' : ''}`,
    onclick: () => {
      state.agentFilter = null;
      render();
    },
  },
    h('div', { style: 'display:flex;align-items:center;gap:0.45rem;min-width:0;' },
      h('div', { class: 'agent-icon-badge', style: '--p-color:var(--text-secondary);' },
        svgIcon('#icon-layers', 12, 12)
      ),
      h('span', { class: 'agent-name-text' }, 'All')
    ),
    h('span', { class: 'nav-count-pill' }, String(totalEntries))
  );

  if (!d.agents || d.agents.length === 0) {
    setChildren(list, allItem);
    return;
  }

  const agentItems = d.agents.map((a) => {
    const meta = getProviderMeta(a.name, a.meta?.provider || a.provider);
    const isActive = state.agentFilter === a.name;
    const modelsStr = a.models && a.models.length ? a.models.join(', ') : timeAgo(a.lastTs);

    return h('button', {
      class: `agent-item-btn ${isActive ? 'active' : ''}`,
      onclick: () => {
        state.agentFilter = state.agentFilter === a.name ? null : a.name;
        render();
      },
    },
      h('div', { style: 'display:flex;align-items:center;gap:0.45rem;min-width:0;' },
        h('div', { class: 'agent-icon-badge', style: `--p-color:${meta.color};` },
          svgIcon(meta.icon, 13, 13)
        ),
        h('div', { style: 'min-width:0;' },
          h('div', { class: 'agent-name-text' }, a.meta?.display || a.name),
          h('div', { class: 'agent-model-text', title: modelsStr }, modelsStr)
        )
      ),
      h('span', { class: 'nav-count-pill' }, String(a.count))
    );
  });

  setChildren(list, allItem, ...agentItems);
}

function renderProjectNav(d) {
  const list = $('#project-nav-list');
  const items = [
    { path: 'all', name: 'All', count: d.stats.entries },
    ...d.projects,
  ];

  setChildren(list, items.map((p) => {
    const isActive = (state.scope === p.path) || (p.path === 'all' && state.scope === 'all');
    return h('button', {
      class: `nav-item-btn ${isActive ? 'active' : ''}`,
      onclick: () => {
        state.scope = p.path;
        state.agentFilter = null;
        fetchState();
      },
    },
      h('div', { class: 'nav-item-left' },
        svgIcon('#icon-folder', 13, 13),
        h('span', { class: 'nav-item-label' }, p.name)
      ),
      h('span', { class: 'nav-count-pill' }, String(p.count || 0))
    );
  }));
}

function renderFeed(d) {
  let entries = d.entries || [];

  const totalHandoffs = entries.filter((e) => e.kind === 'handoff').length;
  const totalSessions = entries.filter((e) => e.kind === 'session').length;
  const totalNotes = entries.filter((e) => e.kind === 'note').length;
  $('#badge-all').textContent = String(entries.length);
  $('#badge-handoff').textContent = String(totalHandoffs);
  $('#badge-session').textContent = String(totalSessions);
  $('#badge-note').textContent = String(totalNotes);

  if (state.kindFilter === 'handoff') entries = entries.filter((e) => e.kind === 'handoff');
  else if (state.kindFilter === 'session') entries = entries.filter((e) => e.kind === 'session');
  else if (state.kindFilter === 'note') entries = entries.filter((e) => e.kind === 'note');

  if (state.agentFilter) {
    entries = entries.filter((e) => e.agent?.name === state.agentFilter);
  }

  const stream = $('#feed-stream');
  if (entries.length === 0) {
    setChildren(stream,
      h('div', { class: 'empty-block' },
        h('p', { style: 'margin:0;font-size:0.85rem;' }, 'No matching diary entries found.')
      )
    );
    return;
  }

  setChildren(stream, entries.map((entry, index) => renderCard(entry, index, d)));
}

function renderCard(entry, index, d) {
  const providerMeta = getProviderMeta(entry.agent?.name || entry.meta?.display, entry.agent?.provider || entry.meta?.provider);
  const isOpen = state.openIds.has(entry.id);
  const isHandoff = entry.kind === 'handoff';
  const isSelected = state.selectedIndex === index;

  const card = h('article', {
    class: `notion-card ${isSelected ? 'selected' : ''}`,
    'data-id': entry.id,
  },
    // Header Line
    h('div', { class: 'card-header-line' },
      h('div', { class: 'card-meta-left' },
        h('div', { class: 'agent-badge-pill' },
          h('div', { class: 'agent-icon-badge', style: `--p-color:${providerMeta.color};` },
            svgIcon(providerMeta.icon, 13, 13)
          ),
          h('span', {}, entry.meta?.display || entry.agent?.name)
        ),
        entry.agent?.model ? h('span', { class: 'meta-prop-pill' }, entry.agent.model) : null,
        entry.branch ? h('span', { class: 'meta-prop-pill' },
          svgIcon('#icon-branch', 9, 9),
          h('span', { style: 'margin-left:2px;' }, entry.branch)
        ) : null,
        d.scope === 'all' && entry.project ? h('span', { class: 'meta-prop-pill' }, entry.project) : null,
        h('span', { class: `kind-pill ${entry.kind}` }, entry.kind === 'handoff' ? '⇄ handoff' : entry.kind)
      ),
      h('span', { class: 'card-time', title: fullDateTime(entry.ts) }, timeAgo(entry.ts))
    ),

    // Title & Summary
    h('h3', { class: 'card-title' },
      h('button', {
        class: 'card-title-btn',
        onclick: () => toggleCard(entry.id),
      }, entry.title)
    ),
    h('p', { class: 'card-summary' }, entry.summary),

    // Notion-Style Callout for Open Threads (Handoff Next Agent Briefing)
    entry.open_threads && entry.open_threads.length > 0 ? h('div', { class: 'notion-callout' },
      svgIcon('#icon-alert', 14, 14),
      h('div', { class: 'callout-content' },
        h('div', { class: 'callout-heading' }, 'Open Threads — Next Agent Briefing'),
        h('ul', { class: 'todo-list' }, entry.open_threads.map((t) =>
          h('li', { class: 'todo-item' },
            svgIcon('#icon-check-square', 12, 12),
            h('span', {}, t)
          )
        ))
      )
    ) : null,

    // Expanded Toggle Details (Decisions, Files, Tags)
    isOpen ? h('div', { class: 'toggle-block' },
      entry.decisions && entry.decisions.length > 0 ? h('div', {},
        h('div', { style: 'font-weight:600;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.25rem;' }, 'Decisions & Rationale'),
        h('ul', { class: 'bullet-list' }, entry.decisions.map((dec) =>
          h('li', { class: 'bullet-item' },
            h('span', { class: 'bullet-dot' }, '•'),
            h('span', {}, dec)
          )
        ))
      ) : null,

      entry.files && entry.files.length > 0 ? h('div', {},
        h('div', { style: 'font-weight:600;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.25rem;' }, `Files Touched (${entry.files.length})`),
        h('div', { class: 'files-grid' }, entry.files.map((file) =>
          h('button', {
            class: 'file-badge-btn',
            title: 'Click to copy file path',
            onclick: () => copyText(file, `Copied ${file}`),
          },
            svgIcon('#icon-file', 10, 10),
            h('span', {}, file)
          )
        ))
      ) : null,

      entry.tags && entry.tags.length > 0 ? h('div', { class: 'tags-row' },
        entry.tags.map((t) => h('span', { class: 'notion-tag' }, `#${t}`))
      ) : null
    ) : null,

    // Action Footer
    h('div', { class: 'card-action-bar' },
      h('div', { class: 'action-cluster' },
        h('button', {
          class: 'action-pill-btn',
          onclick: () => toggleCard(entry.id),
        }, isOpen ? 'Collapse' : 'Details'),
        h('button', {
          class: 'action-pill-btn',
          title: `Copy CLI command: ultrateam show ${entry.id}`,
          onclick: () => copyText(`ultrateam show ${entry.id}`, `Copied command: ultrateam show ${entry.id}`),
        },
          svgIcon('#icon-file', 10, 10),
          h('span', {}, 'CLI show')
        ),
        h('button', {
          class: 'action-pill-btn',
          title: 'View raw JSON representation',
          onclick: () => openJsonModal(entry),
        }, 'JSON')
      ),
      h('span', { class: 'id-label' }, entry.id.slice(0, 10) + '…')
    )
  );

  return card;
}

function toggleCard(id) {
  if (state.openIds.has(id)) state.openIds.delete(id);
  else state.openIds.add(id);
  render();
}

function resetFilters() {
  state.query = '';
  state.agentFilter = null;
  state.kindFilter = 'all';
  $('#search-input').value = '';
  $('#search-clear').style.display = 'none';
  $$('.view-tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.kind === 'all'));
  fetchState();
}

function openJsonModal(entry) {
  const modal = $('#json-modal');
  $('#json-modal-title').textContent = `JSON · ${entry.id}`;
  const jsonStr = JSON.stringify(entry, null, 2);
  $('#json-modal-content').textContent = jsonStr;
  $('#json-copy-btn').onclick = () => copyText(jsonStr, 'JSON copied to clipboard');
  modal.classList.add('open');
}

function closeJsonModal() {
  $('#json-modal').classList.remove('open');
}

let toastTimer = null;
function showToast(msg) {
  const toast = $('#toast-hud');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

function copyText(text, msg = 'Copied to clipboard') {
  navigator.clipboard.writeText(text).then(() => {
    showToast(msg);
  }).catch(() => {
    const t = document.createElement('textarea');
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
    showToast(msg);
  });
}

function renderError(msg) {
  setChildren($('#feed-stream'),
    h('div', { class: 'empty-block' },
      h('p', {}, `Unable to reach ultrateam viewer server: ${msg}`),
      h('button', { class: 'action-pill-btn', style: 'margin-top:0.5rem;', onclick: fetchState }, 'Retry')
    )
  );
}

let searchTimer = null;
const searchInput = $('#search-input');
const searchClear = $('#search-clear');

searchInput.addEventListener('input', (ev) => {
  const val = ev.target.value.trim();
  searchClear.style.display = val ? 'block' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = val;
    fetchState();
  }, 220);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  state.query = '';
  fetchState();
  searchInput.focus();
});

$$('.view-tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    $$('.view-tab-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    state.kindFilter = btn.dataset.kind;
    render();
  });
});

function toggleTheme() {
  document.documentElement.classList.add('disable-transitions');
  const cur = document.documentElement.dataset.theme;
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('ut-theme', next); } catch {}
  updateThemeIcon();

  // Force reflow and restore hover transitions cleanly in the next frame
  window.getComputedStyle(document.documentElement).opacity;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.documentElement.classList.remove('disable-transitions');
    });
  });
}

function updateThemeIcon() {
  const isLight = document.documentElement.dataset.theme === 'light' ||
    (!document.documentElement.dataset.theme && !matchMedia('(prefers-color-scheme: dark)').matches);
  const iconUse = $('#theme-icon use');
  if (iconUse) {
    iconUse.setAttribute('href', isLight ? '#icon-moon' : '#icon-sun');
  }
  const btn = $('#theme-btn');
  if (btn) {
    btn.title = isLight ? 'Switch to dark mode' : 'Switch to light mode';
    btn.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
  }
}

$('#theme-btn').addEventListener('click', toggleTheme);

try {
  const savedTheme = localStorage.getItem('ut-theme');
  if (savedTheme === 'dark' || savedTheme === 'light') {
    document.documentElement.dataset.theme = savedTheme;
  }
  updateThemeIcon();
} catch {}

window.addEventListener('keydown', (ev) => {
  if (document.activeElement === searchInput) {
    if (ev.key === 'Escape') {
      searchInput.blur();
      if (searchInput.value) {
        searchInput.value = '';
        state.query = '';
        fetchState();
      }
    }
    return;
  }

  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k' || ev.key === '/') {
    ev.preventDefault();
    searchInput.focus();
    searchInput.select();
    return;
  }

  if (ev.key === 'Escape') {
    closeJsonModal();
    return;
  }

  if (ev.key.toLowerCase() === 't' && !ev.metaKey && !ev.ctrlKey) {
    toggleTheme();
    return;
  }

  const posts = $$('.notion-card');
  if (posts.length === 0) return;

  if (ev.key.toLowerCase() === 'j') {
    state.selectedIndex = Math.min(posts.length - 1, state.selectedIndex + 1);
    posts[state.selectedIndex]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    render();
  } else if (ev.key.toLowerCase() === 'k') {
    state.selectedIndex = Math.max(0, state.selectedIndex - 1);
    posts[state.selectedIndex]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    render();
  } else if (ev.key.toLowerCase() === 'o' || ev.key === 'Enter') {
    const activeCard = posts[state.selectedIndex];
    if (activeCard) {
      const id = activeCard.dataset.id;
      toggleCard(id);
    }
  }
});

setInterval(() => {
  if (!document.hidden && !state.query) {
    fetchState();
  }
}, 10000);

fetchState();
</script>
